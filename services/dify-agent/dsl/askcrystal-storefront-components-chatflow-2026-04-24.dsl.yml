app:
  description: Advanced chatflow for validating storefront component intent hydration
    in AskCrystal chat.
  icon: 🔮
  icon_background: '#1f2937'
  icon_type: emoji
  mode: advanced-chat
  name: AskCrystal Storefront Components
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-node-source-build-components-target
      source: start_node
      sourceHandle: source
      target: build_components
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: answer
      id: build-components-source-answer-target
      source: build_components
      sourceHandle: source
      target: answer_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 54
      id: start_node
      position:
        x: 40
        y: 242
      positionAbsolute:
        x: 40
        y: 242
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(query: str) -> dict:\n    normalized = (query or \"\").strip()\n    lowered = normalized.lower()\n\n    def product_card(component_id: str, handle: str, reason: str, note: str) -> dict:\n        return {\n            \"component\": \"product_card\",\n            \"id\": component_id,\n            \"priority\": \"primary\",\n            \"props\": {\n                \"eyebrow\": \"Prescription\",\n                \"reason\": reason,\n                \"note\": note,\n                \"cta_label\": \"View crystal\",\n                \"product_ref\": {\n                    \"handle\": handle,\n                },\n            },\n        }\n\n    def product_carousel(component_id: str, title: str, reason: str, handles: list[str]) -> dict:\n        return {\n            \"component\": \"product_carousel\",\n            \"id\": component_id,\n            \"priority\": \"primary\",\n            \"props\": {\n                \"eyebrow\": \"Matched for you\",\n                \"title\": title,\n                \"reason\": reason,\n                \"browse_collection\": {\n                    \"handle\": \"all\",\n                },\n                \"browse_label\": \"Browse more crystals\",\n                \"product_refs\": [\n                    {\n                        \"handle\": handle,\n                    }\n                    for handle in handles\n                ],\n            },\n        }\n\n    def wants_shop_components(text: str) -> bool:\n        return any(\n            term in text\n            for term in [\n                \"recommend\",\n                \"show me\",\n                \"which crystal\",\n                \"what crystal\",\n                \"compare\",\n                \"options\",\n                \"product\",\n                \"shop\",\n                \"browse\",\n                \"buy\",\n                \"best crystal\",\n            ]\n        )\n\n    notes = [\n        \"V1 storefront manifests expose product_card and product_carousel only.\",\n        \"Reading summaries, rituals, next steps, and browse prompts belong in normal prose or native Shopify UI.\",\n        \"Shopify proxy is responsible for hydration and final rendering payloads.\",\n    ]\n\n    if any(term in lowered for term in [\"sleep\", \"calm\", \"anxious\", \"anxiety\", \"rest\", \"overthink\"]):\n        answer_copy = (\n            \"Your field reads more overstimulated than depleted, so I would begin with a softer calming stone \"\n            \"instead of anything too activating. I am keeping the card surface focused on the product, while the \"\n            \"ritual guidance should stay in the assistant answer.\"\n        )\n        components = [\n            product_card(\n                \"sleep-product\",\n                \"amethyst-pendant\",\n                \"Best fit for dialing down mental noise before sleep.\",\n                \"Place it beside the bed and take three long exhales before lights out.\",\n            ),\n        ]\n    elif any(term in lowered for term in [\"protect\", \"protection\", \"ground\", \"grounding\", \"shield\", \"heavy\"]):\n        answer_copy = (\n            \"This reads like energetic leakage and heaviness rather than simple fatigue. I would start with a more \"\n            \"protective crystal, then keep the reset instructions in prose so the product card stays decisive.\"\n        )\n        components = [\n            product_card(\n                \"protect-product\",\n                \"black-tourmaline-tower\",\n                \"A stronger match when the need is shielding, grounding, and energetic containment.\",\n                \"Keep it by the door or workspace and touch it before and after draining interactions.\",\n            ),\n        ]\n    else:\n        answer_copy = (\n            \"I would start broad here instead of overcommitting to one stone too early. The best next move is to \"\n            \"clarify whether the real need is grounding, softness, or clarity before making the storefront carry the \"\n            \"recommendation.\"\n        )\n\n        if wants_shop_components(lowered):\n            components = [\n                product_carousel(\n                    \"general-carousel\",\n                    \"Three crystal directions to compare\",\n                    \"Each option supports a different lane so you can feel whether clarity, softness, or grounding is the real need.\",\n                    [\n                        \"clear-quartz-point\",\n                        \"rose-quartz-palm-stone\",\n                        \"smoky-quartz-generator\",\n                    ],\n                ),\n            ]\n        else:\n            components = []\n\n    return {\n        \"answer_copy\": answer_copy,\n        \"schema_version\": 1,\n        \"components\": components[:1],\n        \"notes\": notes,\n    }"
        code_language: python3
        desc: Storefront component intent bootstrap for the Shopify proxy hydrator.
        outputs:
          answer_copy:
            children: null
            type: string
          components:
            children: null
            type: array[object]
          notes:
            children: null
            type: array[string]
          schema_version:
            children: null
            type: number
        selected: false
        title: Build Storefront Components
        type: code
        variables:
        - value_selector:
          - sys
          - query
          value_type: string
          variable: query
      height: 84
      id: build_components
      position:
        x: 344
        y: 227
      positionAbsolute:
        x: 344
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#build_components.answer_copy#}}'
        desc: ''
        selected: true
        title: Answer
        type: answer
        variables: []
      height: 105
      id: answer_node
      position:
        x: 648
        y: 227
      positionAbsolute:
        x: 648
        y: 227
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
