    - data:
        code: |
          def main(timezone: str = "", format: str = "", locale: str = "") -> dict:
              import re
              from datetime import datetime, timezone as dt_timezone, timedelta

              try:
                  from zoneinfo import ZoneInfo
              except Exception:
                  ZoneInfo = None

              DEFAULT_TIMEZONE = "Asia/Shanghai"
              FALLBACK_TZINFO = dt_timezone(timedelta(hours=8), name="CST")
              ALIASES = {
                  "": DEFAULT_TIMEZONE,
                  "default": DEFAULT_TIMEZONE,
                  "browser": DEFAULT_TIMEZONE,
                  "local": DEFAULT_TIMEZONE,
                  "china": DEFAULT_TIMEZONE,
                  "shanghai": DEFAULT_TIMEZONE,
                  "beijing": DEFAULT_TIMEZONE,
                  "asia/shanghai": DEFAULT_TIMEZONE,
                  "utc": "UTC",
                  "gmt": "UTC",
                  "z": "UTC",
                  "pacific": "America/Los_Angeles",
                  "eastern": "America/New_York",
              }

              def clean(value: str) -> str:
                  return re.sub(r"\s+", " ", str(value or "")).strip()

              def parse_offset(value: str):
                  normalized = clean(value).upper().replace(" ", "")
                  match = re.match(r"^(?:UTC|GMT)?([+-])(\d{1,2})(?::?(\d{2}))?$", normalized)
                  if not match:
                      return None
                  sign = 1 if match.group(1) == "+" else -1
                  hours = int(match.group(2))
                  minutes = int(match.group(3) or "0")
                  if hours > 23 or minutes > 59:
                      return None
                  delta = timedelta(hours=hours, minutes=minutes) * sign
                  label = f"UTC{match.group(1)}{hours:02d}:{minutes:02d}"
                  return label, dt_timezone(delta, name=label)

              def resolve_timezone(value: str):
                  requested = clean(value)
                  key = requested.lower()
                  candidate = ALIASES.get(key, requested or DEFAULT_TIMEZONE)

                  offset_tz = parse_offset(candidate)
                  if offset_tz:
                      label, tzinfo = offset_tz
                      return label, tzinfo, requested or label, False, ""

                  if ZoneInfo is not None:
                      try:
                          return candidate, ZoneInfo(candidate), requested or candidate, False, ""
                      except Exception:
                          pass

                  if candidate == DEFAULT_TIMEZONE:
                      return DEFAULT_TIMEZONE, FALLBACK_TZINFO, requested or DEFAULT_TIMEZONE, True, (
                          "IANA timezone data was unavailable, so Asia/Shanghai used a fixed UTC+08:00 fallback."
                      )

                  if ZoneInfo is not None:
                      try:
                          return DEFAULT_TIMEZONE, ZoneInfo(DEFAULT_TIMEZONE), requested, True, (
                              f"Unsupported timezone '{requested}', so Asia/Shanghai was used."
                          )
                      except Exception:
                          pass

                  return DEFAULT_TIMEZONE, FALLBACK_TZINFO, requested, True, (
                      f"Unsupported timezone '{requested}', so Asia/Shanghai UTC+08:00 was used."
                  )

              def offset_label(delta: timedelta) -> str:
                  total_seconds = int(delta.total_seconds())
                  sign = "+" if total_seconds >= 0 else "-"
                  total_seconds = abs(total_seconds)
                  hours = total_seconds // 3600
                  minutes = (total_seconds % 3600) // 60
                  return f"{sign}{hours:02d}:{minutes:02d}"

              resolved_timezone, tzinfo, requested_timezone, used_fallback, warning = resolve_timezone(timezone)
              utc_now = datetime.now(dt_timezone.utc)
              local_now = utc_now.astimezone(tzinfo)
              local_date = local_now.date()
              utc_offset = offset_label(local_now.utcoffset() or timedelta())
              output_format = clean(format) or "%Y-%m-%d %H:%M:%S %Z"
              try:
                  formatted = local_now.strftime(output_format)
              except Exception:
                  output_format = "%Y-%m-%d %H:%M:%S %Z"
                  formatted = local_now.strftime(output_format)

              yesterday = local_date - timedelta(days=1)
              tomorrow = local_date + timedelta(days=1)
              text = (
                  f"Current local time: {local_now.strftime('%Y-%m-%d %H:%M:%S')} "
                  f"({local_now.strftime('%A')}, {resolved_timezone}, UTC{utc_offset}). "
                  f"UTC time: {utc_now.isoformat().replace('+00:00', 'Z')}. "
                  f"Relative dates: yesterday={yesterday.isoformat()}, today={local_date.isoformat()}, "
                  f"tomorrow={tomorrow.isoformat()}."
              )

              metadata = {
                  "requested_timezone": requested_timezone,
                  "resolved_timezone": resolved_timezone,
                  "locale": clean(locale),
                  "format": output_format,
                  "used_fallback": used_fallback,
                  "warning": warning,
                  "source": "askcrystal-current-time-workflow",
              }

              return {
                  "status": "ok",
                  "text": text,
                  "current_time": formatted,
                  "current_date": local_date.isoformat(),
                  "weekday": local_now.strftime("%A"),
                  "timezone": resolved_timezone,
                  "utc_offset": utc_offset,
                  "utc_time": utc_now.isoformat().replace("+00:00", "Z"),
                  "local_iso": local_now.isoformat(),
                  "unix_timestamp": int(utc_now.timestamp()),
                  "year": local_now.year,
                  "month": local_now.month,
                  "day": local_now.day,
                  "hour": local_now.hour,
                  "minute": local_now.minute,
                  "second": local_now.second,
                  "yesterday": yesterday.isoformat(),
                  "today": local_date.isoformat(),
                  "tomorrow": tomorrow.isoformat(),
                  "metadata": metadata,
              }
        code_language: python3
        desc: Resolve current local and UTC time for agent-visible temporal grounding.
