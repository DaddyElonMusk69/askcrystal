    - data:
        code: |
          def main(text: str, spread_key: str, spread_name: str, cards_json: str, draw_mode: str, seed: str, time_factor: str) -> dict:
              import json
              import re

              def fallback_payload(raw_text: str) -> dict:
                  cleaned = (raw_text or "").strip()
                  summary = cleaned.split("\n")[0][:280] if cleaned else "The tarot interpretation completed, but the structured format needs a retry."
                  findings = [line.strip("-• ") for line in cleaned.splitlines() if line.strip()][:4] or [summary]
                  return {
                      "status": "ok",
                      "skill": "tarot_spread_interpretation",
                      "summary": summary,
                      "findings": findings,
                      "follow_up_questions": [],
                      "recommendations": ["Retry the tarot interpretation if a cleaner structured result is needed."],
                      "safety_note": "For self-reflection and guidance only, not fixed fate.",
                      "metadata": {
                          "confidence": "low",
                          "missing_inputs": [],
                          "source_family": "tarot-skill",
                          "mode": "reading",
                          "intent_type": "reading",
                          "primary_method": "tarot",
                          "spread_type": spread_key,
                          "spread_name": spread_name,
                          "draw_mode": draw_mode,
                          "seed": seed,
                          "time_factor": time_factor,
                          "cards": json.loads(cards_json or "[]"),
                      },
                  }

              raw = (text or "").strip()
              parsed = None
              if raw:
                  candidates = [raw]
                  fenced = re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", raw, re.S)
                  candidates.extend(fenced)
                  brace_match = re.search(r"(\{.*\})", raw, re.S)
                  if brace_match:
                      candidates.append(brace_match.group(1))
                  for candidate in candidates:
                      try:
                          parsed = json.loads(candidate)
                          break
                      except Exception:
                          continue

              payload = parsed if isinstance(parsed, dict) else fallback_payload(raw)
              payload["status"] = payload.get("status") or "ok"
              payload["skill"] = "tarot_spread_interpretation"
              payload["summary"] = str(payload.get("summary") or "")
              payload["findings"] = payload.get("findings") if isinstance(payload.get("findings"), list) else []
              payload["follow_up_questions"] = payload.get("follow_up_questions") if isinstance(payload.get("follow_up_questions"), list) else []
              payload["recommendations"] = payload.get("recommendations") if isinstance(payload.get("recommendations"), list) else []
              payload["safety_note"] = str(payload.get("safety_note") or "For self-reflection and guidance only, not fixed fate.")

              metadata = payload.get("metadata") if isinstance(payload.get("metadata"), dict) else {}
              metadata.setdefault("confidence", "medium")
              metadata.setdefault("missing_inputs", [])
              metadata["source_family"] = "tarot-skill"
              metadata["mode"] = "reading"
              metadata["intent_type"] = "reading"
              metadata["primary_method"] = "tarot"
              metadata["spread_type"] = spread_key
              metadata["spread_name"] = spread_name
              metadata["draw_mode"] = draw_mode
              metadata["seed"] = seed
              metadata["time_factor"] = time_factor
              metadata["cards"] = json.loads(cards_json or "[]")
              payload["metadata"] = metadata

              return payload
