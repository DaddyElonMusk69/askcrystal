  description: Structured tarot spread selection, draw generation, and interpretation for AskCrystal's six-method phase.
  icon: 🔮
  icon_background: '#1f2937'
  icon_type: emoji
  mode: workflow
  name: AskCrystal Tarot Interpretation
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: tarot-start-to-prepare
      source: tarot_start
      sourceHandle: source
      target: tarot_prepare
      targetHandle: target
