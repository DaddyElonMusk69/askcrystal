    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Interpret the tarot spread and return strict JSON only.
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        model:
          completion_params:
            temperature: 0.6
          mode: chat
          name: glm-5
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: |-
            You are the AskCrystal tarot interpretation workflow for a structured six-skill phase.

            Return strict JSON only. Do not use markdown fences. Do not include any explanation outside the JSON object.

            Output shape:
            {
              "status": "ok",
              "skill": "tarot_spread_interpretation",
              "summary": "1-2 sentence reading summary",
              "findings": ["3-5 concise insights"],
              "follow_up_questions": [],
              "recommendations": ["2-4 concrete actions"],
              "safety_note": "For self-reflection and guidance only, not fixed fate.",
              "metadata": {
                "confidence": "medium",
                "missing_inputs": [],
                "source_family": "tarot-skill",
                "mode": "reading",
                "intent_type": "reading",
                "primary_method": "tarot",
                "spread_type": "{{#tarot_prepare.spread_key#}}",
                "spread_name": "{{#tarot_prepare.spread_name#}}",
                "draw_mode": "{{#tarot_prepare.draw_mode#}}",
                "seed": "{{#tarot_prepare.seed#}}",
                "time_factor": "{{#tarot_prepare.time_factor#}}"
              }
            }

            Rules:
            - Keep the tone reflective, warm, and grounded.
            - Never use deterministic fate language.
            - Do not mention tools, workflows, or hidden reasoning.
            - Use the same language as the user's question.
            - Use the context anchor if one is provided.
            - Summary should be compact.
            - Findings should contain the real insight payload, not filler.
            - Recommendations must be practical and specific.
            - Leave follow_up_questions empty unless the spread genuinely cannot be interpreted.
        - role: user
          text: |-
            User question:
            {{#tarot_prepare.normalized_question#}}

            Context anchor:
            {{#tarot_prepare.context_anchor_clean#}}

            Spread:
            {{#tarot_prepare.spread_name#}} ({{#tarot_prepare.spread_key#}})

            Draw mode:
            {{#tarot_prepare.draw_mode#}}

            Time factor:
            {{#tarot_prepare.time_factor#}}

            Seed:
            {{#tarot_prepare.seed#}}

            Cards:
            {{#tarot_prepare.cards_brief#}}
