      source: tarot_prepare
      sourceHandle: source
      target: tarot_gate
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
      id: tarot-gate-needs-input-to-end
      source: tarot_gate
      sourceHandle: needs_input
      target: tarot_end_needs_input
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: code
      id: tarot-gate-ready-to-finalize
      source: tarot_gate
      sourceHandle: 'false'
      target: tarot_finalize
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: tarot-finalize-to-end
      source: tarot_finalize
      sourceHandle: source
      target: tarot_end_ready
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: question
          max_length: null
          options: []
          required: true
          type: paragraph
          variable: question
        - label: spread_type
          max_length: null
          options: []
          required: false
          type: text-input
          variable: spread_type
        - label: cards_drawn
          max_length: null
          options: []
          required: false
          type: paragraph
          variable: cards_drawn
        - label: context_anchor
          max_length: null
          options: []
          required: false
          type: paragraph
          variable: context_anchor
      height: 170
      id: tarot_start
      position:
        x: 40
        y: 260
      positionAbsolute:
        x: 40
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          def main(question: str = "", spread_type: str = "", cards_drawn: str = "", context_anchor: str = "") -> dict:
              import hashlib
              import json
              import random
              import re
              import time
              from datetime import datetime

              major_arcana = [
                  "愚者", "魔术师", "女祭司", "女皇", "皇帝", "教皇", "恋人", "战车",
                  "力量", "隐士", "命运之轮", "正义", "倒吊人", "死神", "节制", "恶魔",
                  "高塔", "星星", "月亮", "太阳", "审判", "世界",
              ]
              suits = {
                  "权杖": "火",
                  "圣杯": "水",
                  "宝剑": "风",
                  "星币": "土",
              }
              ranks = ["Ace", "二", "三", "四", "五", "六", "七", "八", "九", "十", "侍从", "骑士", "皇后", "国王"]
              all_cards = major_arcana + [f"{suit}{rank}" for suit in suits for rank in ranks]
              major_element = {
                  "愚者": "风", "魔术师": "风", "女祭司": "水", "女皇": "土",
                  "皇帝": "火", "教皇": "土", "恋人": "风", "战车": "水",
                  "力量": "火", "隐士": "土", "命运之轮": "火", "正义": "风",
                  "倒吊人": "水", "死神": "水", "节制": "火", "恶魔": "土",
                  "高塔": "火", "星星": "风", "月亮": "水", "太阳": "火",
                  "审判": "火", "世界": "土",
              }
              spreads = {
                  "single": {
                      "name": "单张牌",
                      "positions": [{"name": "当前指引", "key_position": True}],
                  },
                  "three": {
                      "name": "三牌阵",
                      "positions": [
                          {"name": "过去", "key_position": False},
                          {"name": "现在", "key_position": True},
                          {"name": "未来", "key_position": False, "favor_upright": True},
                      ],
                  },
                  "diamond": {
                      "name": "五牌阵",
                      "positions": [
                          {"name": "核心", "key_position": True},
                          {"name": "根源", "key_position": False},
                          {"name": "阻力", "key_position": False},
                          {"name": "潜力", "key_position": False},
                          {"name": "建议", "key_position": True, "favor_upright": True},
                      ],
                  },
                  "moon": {
                      "name": "月亮牌阵",
                      "positions": [
                          {"name": "新月", "key_position": True},
                          {"name": "上弦", "key_position": False},
                          {"name": "满月", "key_position": True},
                          {"name": "下弦", "key_position": False},
                      ],
                  },
                  "horseshoe": {
                      "name": "马蹄形",
                      "positions": [
                          {"name": "远期过去", "key_position": False},
                          {"name": "近期过去", "key_position": False},
                          {"name": "当前", "key_position": True},
                          {"name": "近期未来", "key_position": False},
                          {"name": "外部影响", "key_position": True},
                          {"name": "建议", "key_position": False, "favor_upright": True},
                          {"name": "结果", "key_position": True, "favor_upright": True},
                      ],
                  },
                  "celtic": {
                      "name": "凯尔特十字",
                      "positions": [
                          {"name": "核心", "key_position": True},
                          {"name": "交叉", "key_position": False},
                          {"name": "意识目标", "key_position": False},
                          {"name": "根基过去", "key_position": False},
                          {"name": "近期过去", "key_position": True},
                          {"name": "近期未来", "key_position": False},
                          {"name": "自我", "key_position": False},
                          {"name": "环境", "key_position": False},
                          {"name": "希望与恐惧", "key_position": False},
                          {"name": "结果", "key_position": True, "favor_upright": True},
                      ],
                  },
              }

              def result(status, summary, findings, follow_up_questions, recommendations, missing_inputs, confidence, mode, extra_metadata=None, spread_key="", spread_name=""):
                  metadata = {
                      "confidence": confidence,
                      "missing_inputs": missing_inputs,
                      "source_family": "tarot-skill",
                      "mode": mode,
                      "intent_type": "reading",
                      "primary_method": "tarot",
                  }
                  if spread_key:
                      metadata["spread_type"] = spread_key
                  if spread_name:
                      metadata["spread_name"] = spread_name
                  if extra_metadata:
                      metadata.update(extra_metadata)
                  return {
                      "status": status,
                      "skill": "tarot_spread_interpretation",
                      "summary": summary,
                      "findings": findings,
                      "follow_up_questions": follow_up_questions,
                      "recommendations": recommendations,
                      "safety_note": "For self-reflection and guidance only, not fixed fate.",
                      "metadata": metadata,
                  }

              def normalize_spread(raw_question: str, raw_spread_type: str) -> tuple[str, str, str]:
                  lowered = (raw_spread_type or "").strip().lower()
                  alias_map = {
                      "single": "single", "one": "single", "one-card": "single", "single card": "single", "单张": "single", "每日": "single", "daily": "single",
                      "three": "three", "three-card": "three", "three card": "three", "三张": "three", "三牌": "three", "三牌阵": "three",
                      "diamond": "diamond", "five": "diamond", "five-card": "diamond", "five card": "diamond", "五张": "diamond", "五牌": "diamond", "五牌阵": "diamond", "菱形": "diamond",
                      "moon": "moon", "moon spread": "moon", "月亮": "moon", "月亮牌阵": "moon", "monthly": "moon", "month": "moon",
                      "horseshoe": "horseshoe", "马蹄": "horseshoe", "马蹄形": "horseshoe", "timeline": "horseshoe",
                      "celtic": "celtic", "celtic cross": "celtic", "凯尔特": "celtic", "凯尔特十字": "celtic",
                  }
                  if lowered in alias_map:
                      key = alias_map[lowered]
                      return key, spreads[key]["name"], "explicit"

                  q = (raw_question or "").lower()
                  if any(term in q for term in ["today", "daily", "今日", "今天", "single card"]):
                      return "single", spreads["single"]["name"], "inferred_daily"
                  if any(term in q for term in ["month", "monthly", "this month", "新月", "满月", "月度"]):
                      return "moon", spreads["moon"]["name"], "inferred_monthly"
                  if any(term in q for term in ["why", "root cause", "根源", "阻力", "dilemma", "should i", "抉择", "选择"]):
                      return "diamond", spreads["diamond"]["name"], "inferred_dilemma"
                  if any(term in q for term in ["complex", "everything", "multi", "全面", "复杂", "deep dive"]):
                      return "celtic", spreads["celtic"]["name"], "inferred_complex"
                  return "three", spreads["three"]["name"], "default_general"

              def extract_runtime_hour(raw_context: str):
                  text = raw_context or ""
                  match = re.search(r"\b\d{4}-\d{2}-\d{2}[ T](\d{1,2}):\d{2}(?::\d{2})?", text)
                  if match:
                      try:
                          return max(0, min(23, int(match.group(1))))
                      except ValueError:
                          return None

                  match = re.search(r"\b(\d{1,2}):\d{2}(?::\d{2})?\b", text)
                  if match:
                      try:
                          return max(0, min(23, int(match.group(1))))
                      except ValueError:
                          return None

                  return None

              def get_time_factor(raw_context: str = ""):
                  hour = extract_runtime_hour(raw_context)
                  if hour is None:
                      hour = datetime.now().hour
                  if 6 <= hour < 12:
                      return "morning", ["火", "风"]
                  if 12 <= hour < 18:
                      return "afternoon", ["水", "土"]
                  return "night", ["major"]

              def card_element(card_name: str):
                  if card_name in major_element:
                      return major_element[card_name]
                  for suit, element in suits.items():
                      if card_name.startswith(suit):
                          return element
                  return None

              def draw_cards(spread_key: str, raw_question: str, raw_context: str = ""):
                  spread = spreads[spread_key]
                  positions = spread["positions"]
                  runtime_anchor = (raw_context or "").strip()
                  seed_basis = f"{runtime_anchor}|{spread_key}|{raw_question}" if runtime_anchor else f"{time.time_ns()}{raw_question}"
                  raw = hashlib.sha256(seed_basis.encode()).hexdigest()
                  seed = int(raw[:16], 16)
                  rng = random.Random(seed)
                  time_factor_name, boosted = get_time_factor(runtime_anchor)
                  pool = list(all_cards)
                  drawn = []

                  for pos in positions:
                      is_key = pos.get("key_position", False)
                      favor_upright = pos.get("favor_upright", False)
                      weights = []
                      for card in pool:
                          is_major = card in major_arcana
                          w = 1.0
                          if is_key and is_major:
                              w *= 60 / 28
                          elem = card_element(card)
                          if "major" in boosted and is_major:
                              w *= 1.08
                          elif elem in boosted:
                              w *= 1.08
                          weights.append(w)

                      chosen_idx = rng.choices(range(len(pool)), weights=weights, k=1)[0]
                      chosen_card = pool.pop(chosen_idx)
                      upright_prob = 0.70 if favor_upright else 0.60
                      orientation = "正位" if rng.random() < upright_prob else "逆位"
                      drawn.append({
                          "position": pos["name"],
                          "card": chosen_card,
                          "orientation": orientation,
                          "arcana": "major" if chosen_card in major_arcana else "minor",
                      })

                  return {
                      "seed": str(seed),
                      "time_factor": time_factor_name,
                      "cards": drawn,
                  }

              def parse_cards(raw_cards: str):
                  text = (raw_cards or "").strip()
                  if not text:
                      return None
                  parts = [part.strip(" -•\t") for part in text.replace("；", ";").replace("，", ",").splitlines() if part.strip()]
                  if len(parts) == 1 and ";" in text:
                      parts = [part.strip() for part in text.split(";") if part.strip()]
                  parsed = []
                  default_positions = {
                      1: ["当前指引"],
                      3: ["过去", "现在", "未来"],
                      4: ["新月", "上弦", "满月", "下弦"],
                      5: ["核心", "根源", "阻力", "潜力", "建议"],
                      7: ["远期过去", "近期过去", "当前", "近期未来", "外部影响", "建议", "结果"],
                      10: ["核心", "交叉", "意识目标", "根基过去", "近期过去", "近期未来", "自我", "环境", "希望与恐惧", "结果"],
                  }
                  for idx, part in enumerate(parts, start=1):
                      orientation = "正位"
                      token = part
                      if any(mark in token.lower() for mark in ["逆位", "reversed", "reverse"]):
                          orientation = "逆位"
                      token = token.replace("正位", "").replace("逆位", "").replace("upright", "").replace("reversed", "").replace("reverse", "")
                      if ":" in token:
                          position, card = [piece.strip() for piece in token.split(":", 1)]
                      elif "：" in token:
                          position, card = [piece.strip() for piece in token.split("：", 1)]
                      else:
                          defaults = default_positions.get(len(parts), [])
                          position = defaults[idx - 1] if idx - 1 < len(defaults) else f"位置{idx}"
                          card = token.strip()
                      if not card:
                          continue
                      parsed.append({
                          "position": position,
                          "card": card,
                          "orientation": orientation,
                          "arcana": "major" if card in major_arcana else "minor",
                      })
                  if not parsed:
                      return None
                  inferred_by_count = {1: "single", 3: "three", 4: "moon", 5: "diamond", 7: "horseshoe", 10: "celtic"}
                  inferred_spread = inferred_by_count.get(len(parsed), "three")
                  return {
                      "spread_key": inferred_spread,
                      "spread_name": spreads[inferred_spread]["name"],
                      "seed": "provided",
                      "time_factor": "provided",
                      "cards": parsed,
                  }

              normalized_question = (question or "").strip()
              normalized_context_anchor = (context_anchor or "").strip()
              if not normalized_question:
                  intake = result(
                      "needs_input",
                      "A tarot reading needs a real question or theme before the spread can be interpreted responsibly.",
                      ["The workflow cannot choose a spread or interpret cards without a question."],
                      ["What would you like this tarot reading to focus on: love, work, a decision, or general guidance?"],
                      ["Keep the next prompt focused on one topic so the reading stays clear."],
                      ["question"],
                      "low",
                      "intake",
                  )
                  return {
                      **intake,
                      "normalized_question": "",
                      "context_anchor_clean": normalized_context_anchor,
                      "spread_key": "",
                      "spread_name": "",
                      "cards_json": "[]",
                      "cards_brief": "",
                      "seed": "",
                      "time_factor": "",
                      "draw_mode": "",
                      "spread_reason": "",
                  }

              parsed_cards = parse_cards(cards_drawn)
              spread_key, spread_name, spread_reason = normalize_spread(normalized_question, spread_type)
              draw_mode = "generated"
              confidence = "medium"
              if parsed_cards:
                  draw_payload = parsed_cards
                  spread_key = parsed_cards["spread_key"]
                  spread_name = parsed_cards["spread_name"]
                  draw_mode = "provided"
                  confidence = "medium"
              else:
                  draw_payload = draw_cards(spread_key, normalized_question, normalized_context_anchor)

              cards = draw_payload["cards"]
              cards_brief = "\n".join([
                  f"- {item['position']}: {item['card']}（{item['orientation']}）"
                  for item in cards
              ])
              metadata = {
                  "draw_mode": draw_mode,
                  "seed": draw_payload["seed"],
                  "time_factor": draw_payload["time_factor"],
                  "cards": cards,
                  "spread_reason": spread_reason,
              }
              ready = result(
                  "ready",
                  "The tarot request is ready for spread interpretation.",
                  ["Question validated and spread prepared."],
                  [],
                  [],
                  [],
                  confidence,
                  "reading",
                  extra_metadata=metadata,
                  spread_key=spread_key,
                  spread_name=spread_name,
              )
              return {
                  **ready,
                  "normalized_question": normalized_question,
                  "context_anchor_clean": normalized_context_anchor,
                  "spread_key": spread_key,
                  "spread_name": spread_name,
                  "cards_json": json.dumps(cards, ensure_ascii=False),
                  "cards_brief": cards_brief,
                  "seed": draw_payload["seed"],
                  "time_factor": draw_payload["time_factor"],
                  "draw_mode": draw_mode,
                  "spread_reason": spread_reason,
              }
        code_language: python3
        desc: Validate the tarot question, normalize spread selection, and generate or normalize the card draw.
