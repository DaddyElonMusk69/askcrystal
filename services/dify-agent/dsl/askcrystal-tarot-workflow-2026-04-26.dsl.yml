    - data:
        code: |
          def main(prepare_status: str, prepare_summary: str = "", prepare_findings: list = None, prepare_follow_up_questions: list = None, prepare_recommendations: list = None, prepare_safety_note: str = "", prepare_metadata: dict = None, spread_key: str = "", spread_name: str = "", cards_json: str = "", cards_brief: str = "", draw_mode: str = "", seed: str = "", time_factor: str = "", normalized_question: str = "", context_anchor_clean: str = "", spread_reason: str = "") -> dict:
              import json

              try:
                  cards = json.loads(cards_json or "[]")
              except Exception:
                  cards = []
              status = prepare_status if prepare_status in {"ok", "needs_input"} else "ok"
              metadata = dict(prepare_metadata or {})
              metadata.setdefault("confidence", "medium")
              metadata.setdefault("missing_inputs", [])
              metadata["source_family"] = "tarot-skill"
              metadata["mode"] = "reading"
              metadata["intent_type"] = "reading"
              metadata["primary_method"] = "tarot"
              metadata["spread_type"] = spread_key
              metadata["spread_name"] = spread_name
              metadata["draw_mode"] = draw_mode
              metadata["seed"] = seed
              metadata["time_factor"] = time_factor
              metadata["cards"] = cards
              if cards_brief:
                  metadata["cards_brief"] = cards_brief
              if normalized_question:
                  metadata["question"] = normalized_question
              if context_anchor_clean:
                  metadata["context_anchor"] = context_anchor_clean
              if spread_reason:
                  metadata["spread_reason"] = spread_reason

              return {
                  "status": status,
                  "skill": "tarot_spread_interpretation",
                  "summary": str(prepare_summary or "The tarot spread is ready for interpretation."),
                  "findings": prepare_findings or [],
                  "follow_up_questions": prepare_follow_up_questions or [],
                  "recommendations": prepare_recommendations or [],
                  "safety_note": str(prepare_safety_note or "For self-reflection and guidance only, not fixed fate."),
                  "metadata": metadata,
              }
