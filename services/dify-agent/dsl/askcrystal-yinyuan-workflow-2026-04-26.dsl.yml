    - data:
        code: |
          def main(text: str, prepare_status: str, prepare_findings: list = None, prepare_follow_up_questions: list = None, prepare_recommendations: list = None, prepare_metadata: dict = None) -> dict:
              import json
              import re

              def fallback_payload(raw_text: str) -> dict:
                  cleaned = (raw_text or "").strip()
                  summary = cleaned.split("\n")[0][:280] if cleaned else "The relationship interpretation completed, but the structured format needs a retry."
                  findings = [line.strip("-• ") for line in cleaned.splitlines() if line.strip()][:4] or (prepare_findings or [summary])
                  return {
                      "status": prepare_status if prepare_status in {"ok", "needs_input"} else "ok",
                      "skill": "yinyuan_matchmaking",
                      "summary": summary,
                      "findings": findings,
                      "follow_up_questions": prepare_follow_up_questions or [],
                      "recommendations": prepare_recommendations or ["Retry the relationship interpretation if a cleaner structured result is needed."],
                      "safety_note": "For reflection and relationship support only, not a guarantee about outcomes.",
                      "metadata": dict(prepare_metadata or {}),
                  }

              raw = (text or "").strip()
              parsed = None
              if raw:
                  candidates = [raw]
                  fenced = re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", raw, re.S)
                  candidates.extend(fenced)
                  brace_match = re.search(r"(\{.*\})", raw, re.S)
                  if brace_match:
                      candidates.append(brace_match.group(1))
                  for candidate in candidates:
                      try:
                          parsed = json.loads(candidate)
                          break
                      except Exception:
                          continue

              payload = parsed if isinstance(parsed, dict) else fallback_payload(raw)
              payload["status"] = payload.get("status") or (prepare_status if prepare_status in {"ok", "needs_input"} else "ok")
              if payload["status"] not in {"ok", "needs_input"}:
                  payload["status"] = prepare_status if prepare_status in {"ok", "needs_input"} else "ok"
              payload["skill"] = "yinyuan_matchmaking"
              payload["summary"] = str(payload.get("summary") or "")
              payload["findings"] = payload.get("findings") if isinstance(payload.get("findings"), list) else (prepare_findings or [])
              payload["follow_up_questions"] = payload.get("follow_up_questions") if isinstance(payload.get("follow_up_questions"), list) else (prepare_follow_up_questions or [])
              payload["recommendations"] = payload.get("recommendations") if isinstance(payload.get("recommendations"), list) else (prepare_recommendations or [])
              payload["safety_note"] = str(payload.get("safety_note") or "For reflection and relationship support only, not a guarantee about outcomes.")

              metadata = dict(prepare_metadata or {})
              llm_metadata = payload.get("metadata") if isinstance(payload.get("metadata"), dict) else {}
              metadata.update(llm_metadata)
              metadata.setdefault("confidence", "medium" if payload["status"] == "ok" else "low")
              metadata.setdefault("missing_inputs", [])
              payload["metadata"] = metadata

              return payload
        code_language: python3
        desc: Parse the LLM response into the shared yinyuan workflow contract.
