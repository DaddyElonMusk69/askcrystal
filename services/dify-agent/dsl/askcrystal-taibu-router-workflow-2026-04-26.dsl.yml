app:
  description: Deterministic workflow router for AskCrystal's bounded divination workflow phase.
  icon: 🧭
  icon_background: '#1f2937'
  icon_type: emoji
  mode: workflow
  name: AskCrystal Taibu Router
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: taibu-start-to-router
      source: taibu_start
      sourceHandle: source
      target: taibu_router
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: taibu-router-to-end
      source: taibu_router
      sourceHandle: source
      target: taibu_end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: user_query
          max_length: null
          options: []
          required: true
          type: text-input
          variable: user_query
        - label: available_methods
          max_length: null
          options: []
          required: false
          type: text-input
          variable: available_methods
      height: 118
      id: taibu_start
      position:
        x: 40
        y: 240
      positionAbsolute:
        x: 40
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          def main(user_query: str, available_methods: str = "") -> dict:
              normalized = (user_query or "").strip()
              lowered = normalized.lower()
              methods = [
                  method.strip()
                  for method in (available_methods or "bazi, tarot, horoscope, fengshui, yinyuan, numerology").split(",")
                  if method.strip()
              ]
              methods_set = {method.lower() for method in methods}

              def has_any(*terms: str) -> bool:
                  return any(term in lowered for term in terms)

              def result(
                  status: str,
                  summary: str,
                  findings: list[str],
                  follow_up_questions: list[str],
                  recommendations: list[str],
                  missing_inputs: list[str],
                  intent_type: str,
                  primary_method: str,
                  next_tool: str = "",
                  confidence: str = "medium",
                  mode: str = "router",
              ) -> dict:
                  metadata = {
                      "confidence": confidence,
                      "missing_inputs": missing_inputs,
                      "source_family": "taibu",
                      "mode": mode,
                      "intent_type": intent_type,
                      "primary_method": primary_method,
                  }
                  if next_tool:
                      metadata["next_tool"] = next_tool
                  return {
                      "status": status,
                      "skill": "taibu_structured_divination_router",
                      "summary": summary,
                      "findings": findings,
                      "follow_up_questions": follow_up_questions,
                      "recommendations": recommendations,
                      "safety_note": "For routing and reflection support only, not a final divination output.",
                      "metadata": metadata,
                  }

              if not normalized:
                  return result(
                      "needs_input",
                      "The request is empty, so the next step is to ask what kind of reading or guidance the user wants.",
                      ["The router cannot choose a method without a real user request."],
                      ["What would you like help with: Bazi, tarot, horoscope, fengshui, compatibility, numerology, or shopping guidance?"],
                      ["Keep the follow-up short and method-oriented."],
                      ["user_query"],
                      "out_of_scope",
                      "none",
                      confidence="low",
                      mode="intake",
                  )

              shopping_terms = [
                  "buy", "shop", "show me", "product", "products", "collection", "catalog",
                  "under $", "under$", "price", "necklace", "bracelet", "ring", "cart",
              ]
              policy_terms = [
                  "shipping", "return", "refund", "policy", "faq", "exchange", "delivery", "track my order",
              ]
              bazi_terms = ["bazi", "八字", "四柱", "day master", "大运", "流年", "命盘", "算命", "fortune telling"]
              tarot_terms = ["tarot", "塔罗", "draw", "cards", "card", "spread", "pull a card", "pull cards"]
              horoscope_terms = [
                  "horoscope", "zodiac", "star sign", "sun sign", "astrology forecast",
                  "daily sign", "weekly sign", "monthly sign", "aries", "taurus", "gemini",
                  "cancer", "leo", "virgo", "libra", "scorpio", "sagittarius", "capricorn",
                  "aquarius", "pisces", "星座", "运势",
              ]
              fengshui_terms = ["fengshui", "feng shui", "风水", "bed", "desk", "door", "window", "layout", "room", "bedroom", "workspace"]
              yinyuan_terms = ["compatib", "姻缘", "matchmaking", "relationship", "marriage", "正缘", "配不配", "桃花", "meet the right person"]
              numerology_terms = ["numerology", "life path", "number pattern", "birthday pattern", "数字", "数字命理"]

              matched = []
              if has_any(*shopping_terms):
                  matched.append("shopping")
              if has_any(*policy_terms):
                  matched.append("policy")
              if has_any(*bazi_terms):
                  matched.append("bazi")
              if has_any(*tarot_terms):
                  matched.append("tarot")
              if has_any(*horoscope_terms):
                  matched.append("horoscope")
              if has_any(*fengshui_terms):
                  matched.append("fengshui")
              if has_any(*yinyuan_terms):
                  matched.append("yinyuan")
              if has_any(*numerology_terms):
                  matched.append("numerology")

              if "shopping" in matched and len([m for m in matched if m not in {"shopping", "policy"}]) == 0:
                  return result(
                      "ok",
                      "This request is primarily shopping-oriented, so the best next step is to stay in Shopify tools rather than route into a divination workflow.",
                      [
                          "The language focuses on products or catalog browsing.",
                          "No supported divination method is required to answer responsibly.",
                      ],
                      [],
                      ["Use Shopify catalog tools directly and ground any product recommendation in real results."],
                      [],
                      "shopping_only",
                      "none",
                      confidence="high",
                  )

              if "policy" in matched and len([m for m in matched if m not in {"shopping", "policy"}]) == 0:
                  return result(
                      "ok",
                      "This request is operational rather than divinatory, so it should stay in policy or cart tooling.",
                      [
                          "The language points to policy, delivery, or order support.",
                          "A metaphysics workflow would add noise rather than value.",
                      ],
                      [],
                      ["Use policy or cart tools directly."],
                      [],
                      "policy_or_cart",
                      "none",
                      confidence="high",
                  )

              chosen = ""
              missing_inputs = []
              next_tool = ""
              recommendations = []
              findings = []
              follow_up_questions = []
              confidence = "medium"
              intent_type = "reading"

              specific_matches = [m for m in matched if m not in {"shopping", "policy"}]
              if len(specific_matches) > 1:
                  intent_type = "mixed_reading"

              if "bazi" in specific_matches and "bazi" in methods_set:
                  chosen = "bazi"
                  missing_inputs = ["birth_datetime", "gender"]
                  next_tool = "workflow_bazi_chart_analysis"
                  findings = [
                      "The request asks for long-cycle personal pattern or chart-based interpretation, which fits Bazi best.",
                      "Any other supported method should stay secondary until the Bazi intake is complete.",
                  ]
                  follow_up_questions = [
                      "What is the birth date and time, as precisely as you know it?",
                      "What gender should be used for the luck-pillar direction?",
                  ]
                  recommendations = [
                      "Collect the minimum birth details before starting the reading.",
                      "Keep tarot or other methods as a later confirmation layer if the user still wants them.",
                  ]
              elif "tarot" in specific_matches and "tarot" in methods_set:
                  chosen = "tarot"
                  next_tool = "workflow_tarot_spread_interpretation"
                  findings = [
                      "The request is short-horizon, emotional, or card-oriented, which fits tarot best.",
                      "The route does not require long-cycle charting first.",
                  ]
                  recommendations = [
                      "If the user has already drawn cards, interpret those directly.",
                      "If not, choose an appropriately scoped spread before reading.",
                  ]
              elif "horoscope" in specific_matches and "horoscope" in methods_set:
                  chosen = "horoscope"
                  missing_inputs = ["zodiac_sign"]
                  next_tool = "workflow_horoscope_daily_guidance"
                  findings = [
                      "The request is Western zodiac or sun-sign oriented, which fits horoscope guidance best.",
                      "This route should stay symbolic and reflective rather than precise astronomical charting.",
                  ]
                  follow_up_questions = ["What is the zodiac sign, or what birth date should be used to infer it?"]
                  recommendations = [
                      "Use daily, weekly, or monthly horoscope framing based on the user's wording.",
                      "Keep product recommendations separate unless the user also asks to shop.",
                  ]
              elif "fengshui" in specific_matches and "fengshui" in methods_set:
                  chosen = "fengshui"
                  missing_inputs = ["space_description"]
                  next_tool = "workflow_fengshui_space_audit"
                  findings = [
                      "The question is about space, placement, or environmental flow.",
                      "A layout-based audit is more appropriate than a personal chart reading.",
                  ]
                  follow_up_questions = ["Can you describe the room layout, including the bed, desk, door, and windows?"]
                  recommendations = ["Prioritize one practical room or workspace description before deeper interpretation."]
              elif "yinyuan" in specific_matches and "yinyuan" in methods_set:
                  chosen = "yinyuan"
                  missing_inputs = ["question"]
                  next_tool = "workflow_yinyuan_matchmaking"
                  findings = [
                      "The request centers on compatibility, relationship timing, or romantic fit.",
                      "A supportive matchmaking-style route fits better than a general reading.",
                  ]
                  recommendations = [
                      "Clarify whether the user wants compatibility, timing, or a general relationship read.",
                      "Collect the second person's details only if the question actually requires comparison.",
                  ]
              elif "numerology" in specific_matches and "numerology" in methods_set:
                  chosen = "numerology"
                  missing_inputs = ["birth_date"]
                  next_tool = "workflow_shushu_numerology_profile"
                  findings = [
                      "The request is number-pattern oriented rather than chart-structure oriented.",
                      "A birthday-based numerology profile is the cleanest next route.",
                  ]
                  follow_up_questions = ["What birth date should be used for the profile?"]
                  recommendations = ["Keep the output reflective and pattern-oriented instead of overclaiming precision."]
              elif specific_matches:
                  chosen = "none"
                  confidence = "low"
                  findings = [
                      "The request touches a divination area, but it does not cleanly map to one of the supported routes in this phase.",
                      "The safest next step is to offer the nearest supported alternative.",
                  ]
                  recommendations = ["Explain the currently supported methods and invite the user to choose the closest one."]
                  intent_type = "out_of_scope"
              else:
                  chosen = "none"
                  confidence = "low"
                  findings = [
                      "The request does not clearly signal one supported divination route.",
                      "The safest next step is a short clarification rather than forcing a method.",
                  ]
                  follow_up_questions = ["Would you like Bazi, tarot, horoscope, fengshui, relationship guidance, numerology, or shopping help?"]
                  recommendations = ["Use one short clarification question to narrow the route."]
                  intent_type = "out_of_scope"

              summary_map = {
                  "bazi": "This request is best handled through Bazi first because it asks for deeper pattern or long-cycle interpretation.",
                  "tarot": "This request is best handled through tarot because it is short-horizon and reflective in nature.",
                  "horoscope": "This request is best handled through horoscope guidance because it asks for Western zodiac or sun-sign reflection.",
                  "fengshui": "This request is best handled through fengshui because it focuses on layout and environmental flow.",
                  "yinyuan": "This request is best handled through yinyuan because it centers on relationship fit or timing.",
                  "numerology": "This request is best handled through numerology because it asks for a date- or number-pattern profile.",
                  "none": "This request should not be routed into a divination workflow yet.",
              }

              return result(
                  "ok" if chosen != "none" or intent_type in {"shopping_only", "policy_or_cart"} else "needs_input",
                  summary_map.get(chosen, "This request needs a clearer route before a reading begins."),
                  findings,
                  follow_up_questions,
                  recommendations,
                  missing_inputs,
                  intent_type,
                  chosen,
                  next_tool,
                  confidence=confidence,
                  mode="router" if chosen != "none" else "intake",
              )
        code_language: python3
        desc: Deterministic first-pass route selector for the bounded AskCrystal workflow phase.
        outputs:
          status:
            children: null
            type: string
          skill:
            children: null
            type: string
          summary:
            children: null
            type: string
          findings:
            children: null
            type: array[string]
          follow_up_questions:
            children: null
            type: array[string]
          recommendations:
            children: null
            type: array[string]
          safety_note:
            children: null
            type: string
          metadata:
            children: null
            type: object
        selected: false
        title: Route Request
        type: code
        variables:
        - value_selector:
          - taibu_start
          - user_query
          value_type: string
          variable: user_query
        - value_selector:
          - taibu_start
          - available_methods
          value_type: string
          variable: available_methods
      height: 84
      id: taibu_router
      position:
        x: 344
        y: 240
      positionAbsolute:
        x: 344
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - taibu_router
          - status
          value_type: string
          variable: status
        - value_selector:
          - taibu_router
          - skill
          value_type: string
          variable: skill
        - value_selector:
          - taibu_router
          - summary
          value_type: string
          variable: summary
        - value_selector:
          - taibu_router
          - findings
          value_type: array[string]
          variable: findings
        - value_selector:
          - taibu_router
          - follow_up_questions
          value_type: array[string]
          variable: follow_up_questions
        - value_selector:
          - taibu_router
          - recommendations
          value_type: array[string]
          variable: recommendations
        - value_selector:
          - taibu_router
          - safety_note
          value_type: string
          variable: safety_note
        - value_selector:
          - taibu_router
          - metadata
          value_type: object
          variable: metadata
        selected: false
        title: End
        type: end
      height: 238
      id: taibu_end
      position:
        x: 648
        y: 160
      positionAbsolute:
        x: 648
        y: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
