app:
  description: Grounded home and workspace fengshui audit workflow for AskCrystal's six-method phase.
  icon: 🧭
  icon_background: '#1f2937'
  icon_type: emoji
  mode: workflow
  name: AskCrystal Fengshui Space Audit
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: fengshui-start-to-prepare
      source: fengshui_start
      sourceHandle: source
      target: fengshui_prepare
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
      id: fengshui-prepare-to-finalize
      source: fengshui_prepare
      sourceHandle: source
      target: fengshui_finalize
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: fengshui-finalize-to-end
      source: fengshui_finalize
      sourceHandle: source
      target: fengshui_end_ready
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: space_description
          max_length: null
          options: []
          required: true
          type: paragraph
          variable: space_description
        - label: facing_direction
          max_length: null
          options: []
          required: false
          type: text-input
          variable: facing_direction
        - label: priority_goal
          max_length: null
          options: []
          required: false
          type: text-input
          variable: priority_goal
        - label: move_in_year
          max_length: null
          options: []
          required: false
          type: text-input
          variable: move_in_year
      height: 194
      id: fengshui_start
      position:
        x: 40
        y: 260
      positionAbsolute:
        x: 40
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          def main(space_description: str = "", facing_direction: str = "", priority_goal: str = "", move_in_year: str = "") -> dict:
              import re

              direction_aliases = {
                  "north": ["north", "n", "北", "正北"],
                  "south": ["south", "s", "南", "正南"],
                  "east": ["east", "e", "东", "正东"],
                  "west": ["west", "w", "西", "正西"],
                  "northeast": ["northeast", "north east", "ne", "东北"],
                  "northwest": ["northwest", "north west", "nw", "西北"],
                  "southeast": ["southeast", "south east", "se", "东南"],
                  "southwest": ["southwest", "south west", "sw", "西南"],
              }
              goal_keywords = {
                  "sleep": ["sleep", "rest", "insomnia", "bedroom", "睡", "失眠", "卧室"],
                  "focus": ["focus", "study", "work", "desk", "office", "productivity", "学习", "工作", "书房", "办公"],
                  "wealth": ["wealth", "money", "finance", "business", "career", "财", "事业", "生意"],
                  "relationships": ["relationship", "marriage", "love", "couple", "感情", "婚姻", "桃花"],
                  "health": ["health", "recovery", "wellness", "病", "健康"],
                  "calm": ["calm", "peace", "anxiety", "quiet", "情绪", "平静", "焦虑"],
              }
              space_type_keywords = {
                  "bedroom": ["bedroom", "bed", "睡房", "卧室", "床"],
                  "workspace": ["office", "desk", "studio", "workspace", "shop", "公司", "办公室", "工位", "店"],
                  "home": ["home", "apartment", "house", "living room", "kitchen", "bathroom", "家", "客厅", "厨房", "卫生间"],
              }
              period_labels = {
                  "period-8": "Period 8 (2004-2023)",
                  "period-9": "Period 9 (2024-2043)",
                  "unknown": "unknown",
              }
              issue_library = [
                  {
                      "tag": "entrance-blocked",
                      "patterns": ["entrance blocked", "door blocked", "front door blocked", "门口堆", "玄关堆", "门被挡", "entry clutter"],
                      "finding": "The entry sounds obstructed, which usually weakens the sense of arrival and smooth qi flow.",
                      "recommendation": "Clear the first one or two steps inside the entrance and keep that zone bright, breathable, and easy to move through.",
                      "scope": "entrance",
                  },
                  {
                      "tag": "door-window-line",
                      "patterns": ["door facing window", "front door facing window", "door to window", "门对窗", "穿堂", "through draft", "through flow"],
                      "finding": "A straight door-to-window line often makes the space feel leaky or hard to settle into.",
                      "recommendation": "Add a soft pause between the entrance and the far opening with a rug, console, plant, or screen so the space can hold energy more calmly.",
                      "scope": "entrance",
                  },
                  {
                      "tag": "mirror-facing-bed",
                      "patterns": ["mirror facing bed", "mirror opposite bed", "镜子对床", "床对镜子"],
                      "finding": "A mirror facing the bed can make a rest-oriented room feel overstimulated or hard to fully settle.",
                      "recommendation": "Move the mirror, angle it away, or cover it at night so the sleep zone feels more contained.",
                      "scope": "bedroom",
                  },
                  {
                      "tag": "bed-near-bathroom",
                      "patterns": ["bed against bathroom", "bed near bathroom", "bedhead against bathroom", "床头靠厕所", "床靠卫生间"],
                      "finding": "A bed too close to a bathroom wall can make the sleep zone feel damp, noisy, or unsupported.",
                      "recommendation": "If possible, move the bed to a more solid wall. If not, strengthen the wall with a substantial headboard and keep the bathroom especially dry and well ventilated.",
                      "scope": "bedroom",
                  },
                  {
                      "tag": "beam-over-bed-or-desk",
                      "patterns": ["beam over bed", "beam over desk", "横梁压床", "横梁压桌", "beam overhead"],
                      "finding": "A heavy beam over a bed or desk often creates a subtle pressure effect over time.",
                      "recommendation": "Shift the bed or desk out from directly under the beam when possible, or visually soften the pressure with a ceiling treatment and gentler lighting.",
                      "scope": "bedroom",
                  },
                  {
                      "tag": "desk-no-support",
                      "patterns": ["desk facing wall", "desk in middle of room", "desk with back to door", "书桌背门", "桌子背门"],
                      "finding": "The work setup sounds short on backing or command position, which can reduce focus and psychological ease.",
                      "recommendation": "Place the desk where the door is visible without sitting directly in line with it, and give the chair a more solid backdrop.",
                      "scope": "workspace",
                  },
                  {
                      "tag": "kitchen-bathroom-conflict",
                      "patterns": ["kitchen next to bathroom", "kitchen facing bathroom", "厨房对厕所", "厨厕相邻", "厨厕相对"],
                      "finding": "Kitchen-bathroom conflict tends to mix nourishment and drainage zones in a way that feels energetically muddy.",
                      "recommendation": "Keep both zones especially clean, shut one door when possible, and create stronger visual separation between the two functions.",
                      "scope": "kitchen",
                  },
                  {
                      "tag": "center-cluttered",
                      "patterns": ["center cluttered", "middle cluttered", "center full", "中宫堆", "房子中间很满", "中央杂乱"],
                      "finding": "A crowded center can make the whole space feel heavy because the middle acts like the breathing point of the layout.",
                      "recommendation": "Lighten the center of the plan first and avoid storing bulky items there if you want the whole space to feel clearer.",
                      "scope": "center",
                  },
                  {
                      "tag": "dark-space",
                      "patterns": ["dark room", "no sunlight", "dim", "采光差", "很暗", "没光"],
                      "finding": "Low light can make a space feel stagnant even when the layout itself is decent.",
                      "recommendation": "Improve layered lighting and reflectance before buying decor. Brightening the space is often the fastest fengshui upgrade.",
                      "scope": "lighting",
                  },
              ]

              def clean(value: str) -> str:
                  return re.sub(r"\s+", " ", str(value or "")).strip()

              def result(status, summary, findings, follow_up_questions, recommendations, missing_inputs, confidence, mode, extra_metadata=None):
                  metadata = {
                      "confidence": confidence,
                      "missing_inputs": missing_inputs,
                      "source_family": "fengshui.skill",
                      "mode": mode,
                      "intent_type": "audit",
                      "primary_method": "fengshui",
                  }
                  if extra_metadata:
                      metadata.update(extra_metadata)
                  return {
                      "status": status,
                      "skill": "fengshui_space_audit",
                      "summary": summary,
                      "findings": findings,
                      "follow_up_questions": follow_up_questions,
                      "recommendations": recommendations,
                      "safety_note": "For environmental reflection only, not a substitute for structural, safety, or professional building advice.",
                      "metadata": metadata,
                  }

              def normalize_direction(text: str) -> str:
                  lowered = clean(text).lower()
                  for canonical, aliases in direction_aliases.items():
                      for alias in aliases:
                          alias_lower = alias.lower()
                          if len(alias_lower) <= 2 and re.match(r"^[a-z]+$", alias_lower):
                              if re.search(rf"(?<![a-z]){re.escape(alias_lower)}(?![a-z])", lowered):
                                  return canonical
                              continue
                          if alias_lower in lowered:
                              return canonical
                  return ""

              def detect_goal(text: str) -> str:
                  lowered = clean(text).lower()
                  for goal, keywords in goal_keywords.items():
                      if any(keyword.lower() in lowered for keyword in keywords):
                          return goal
                  return "general"

              def detect_space_type(text: str) -> str:
                  lowered = clean(text).lower()
                  for space_type, keywords in space_type_keywords.items():
                      if any(keyword.lower() in lowered for keyword in keywords):
                          return space_type
                  return "space"

              def extract_year(text: str) -> str:
                  matches = re.findall(r"\b(19\d{2}|20\d{2})\b", text or "")
                  return matches[0] if matches else ""

              def determine_period(year_text: str) -> str:
                  if not year_text:
                      return "unknown"
                  year = int(year_text)
                  if 2004 <= year <= 2023:
                      return "period-8"
                  if 2024 <= year <= 2043:
                      return "period-9"
                  return "unknown"

              def direction_note(direction: str, goal: str) -> tuple[str, str]:
                  notes = {
                      "south": (
                          "A south-facing emphasis can work well in Period 9 when the front of the space feels bright, open, and not overly harsh.",
                          "Support the south-facing side with warm but controlled lighting and avoid visually choking the front of the space.",
                      ),
                      "north": (
                          "A north-facing space often benefits from warmth, layering, and stronger visual support so it does not feel overly cool or withdrawn.",
                          "Use warmer light, stable furniture placement, and a more intentional entry sequence to prevent the space from feeling thin or drained.",
                      ),
                      "east": (
                          "East-facing energy often supports growth, learning, and steady morning momentum when the layout is uncluttered.",
                          "Keep the eastern side active but not chaotic, especially if the goal is focus or healthy routine.",
                      ),
                      "west": (
                          "West-facing rooms can feel sharp or drying if the light is intense, so balance matters more than adding more stimulation.",
                          "Soften glare and keep the room grounded with texture, calm storage, and less visual aggression.",
                      ),
                      "southeast": (
                          "Southeast is often a useful zone for slow growth, study, and resource-building when it stays orderly.",
                          "Keep the southeast area light, well maintained, and free of dead storage if the goal involves growth or financial steadiness.",
                      ),
                      "southwest": (
                          "Southwest tends to reward stability, heavier support, and settled routines more than constant rearrangement.",
                          "Use the southwest for grounded, restorative functions rather than high-chaos storage or transit.",
                      ),
                      "northeast": (
                          "Northeast usually benefits from clarity and disciplined use, especially when the goal is study, planning, or calm reset.",
                          "Avoid making the northeast noisy or overstuffed if you want the room to feel mentally clean.",
                      ),
                      "northwest": (
                          "Northwest can feel strong and structured, which helps leadership energy but can feel hard if the room lacks softness.",
                          "Balance the northwest with texture and human warmth so it supports authority without becoming rigid.",
                      ),
                  }
                  return notes.get(direction, ("", ""))

              description_clean = clean(space_description)
              direction_clean = clean(facing_direction)
              goal_clean = clean(priority_goal)
              move_in_year_clean = clean(move_in_year) or extract_year(description_clean)
              combined_text = " ".join(part for part in [description_clean, direction_clean, goal_clean] if part)
              direction = normalize_direction(direction_clean or description_clean)
              goal = detect_goal(goal_clean or description_clean)
              space_type = detect_space_type(description_clean)
              period = determine_period(move_in_year_clean)

              if not description_clean or len(description_clean) < 18:
                  intake = result(
                      "needs_input",
                      "A fengshui audit needs a short but concrete description of the space before it can say anything reliable.",
                      ["The current prompt does not describe the room, layout, or friction point clearly enough to audit."],
                      [
                          "Describe the space in one short paragraph: what kind of room it is, where the door, bed, desk, kitchen, or bathroom sit, and what feels off.",
                      ],
                      ["If you know the facing direction or move-in year, include those too for a more grounded read."],
                      ["space_description"],
                      "low",
                      "intake",
                  )
                  return {
                      **intake,
                      "space_description_clean": description_clean,
                      "facing_direction_normalized": direction,
                      "priority_goal_normalized": goal_clean,
                      "move_in_year_normalized": move_in_year_clean,
                      "space_type": space_type,
                      "goal_detected": goal,
                      "move_in_period": period,
                      "issue_tags": "",
                      "audit_scope": "",
                      "fact_brief": "",
                  }

              findings = []
              follow_up_questions = []
              recommendations = []
              detected_tags = []
              scopes = []
              lower_text = combined_text.lower()

              for issue in issue_library:
                  if any(pattern.lower() in lower_text for pattern in issue["patterns"]):
                      detected_tags.append(issue["tag"])
                      scopes.append(issue["scope"])
                      findings.append(issue["finding"])
                      recommendations.append(issue["recommendation"])

              if not detected_tags:
                  findings.append("The description does not point to one severe fengshui fault, so the audit should stay focused on flow, support, light, and room function.")
                  recommendations.append("Treat this as a refinement audit: clear the entry, strengthen the room's main function, and reduce anything that competes with the user's priority goal.")
                  scopes.append("general")

              if goal == "sleep":
                  findings.append("For a sleep-focused room, the main test is whether the bed feels protected, quiet, and visually settled.")
                  recommendations.append("Prioritize a solid headboard wall, softer evening light, and fewer reflective or noisy elements around the bed zone.")
              elif goal == "focus":
                  findings.append("For a focus goal, the room works best when the desk feels supported and visual noise is limited.")
                  recommendations.append("Let the desk command the room rather than float in chaos, and give work tools a clear home so attention is not constantly pulled sideways.")
              elif goal == "wealth":
                  findings.append("For a wealth or business goal, the entry sequence and the visible front of the space matter more than decorative cures.")
                  recommendations.append("Strengthen the sense of welcome, repair anything worn near the entrance, and keep the first visible zone orderly and alive.")
              elif goal == "relationships":
                  findings.append("For relationship support, the room should feel paired, balanced, and emotionally easy rather than overly sharp or single-sided.")
                  recommendations.append("Look for asymmetry around the bed or seating area and soften anything that makes one person feel peripheral to the space.")
              elif goal == "health":
                  findings.append("For health-oriented spaces, stale corners, dark circulation paths, and mixed-function clutter tend to matter more than symbolic objects.")
                  recommendations.append("Open airflow, simplify hard-to-clean buildup, and reduce heaviness where the body is meant to recover.")
              elif goal == "calm":
                  findings.append("For calm, the best fengshui move is usually subtraction rather than adding more objects.")
                  recommendations.append("Reduce visual interruption first and let lighting, pathways, and storage do the emotional heavy lifting.")

              dir_finding, dir_recommendation = direction_note(direction, goal)
              if dir_finding:
                  findings.append(dir_finding)
              if dir_recommendation:
                  recommendations.append(dir_recommendation)

              if period == "period-8":
                  findings.append("The move-in timing points to Period 8 foundations, so the audit should respect what still feels stable while gently adapting the space to the current Period 9 climate.")
              elif period == "period-9":
                  findings.append("The move-in timing already sits inside Period 9, so light, visibility, and the emotional tone of the front-facing zones carry extra weight.")
              else:
                  follow_up_questions.append("If you want a more tailored read, share the move-in or last major renovation year.")

              if not direction:
                  follow_up_questions.append("If you know the space's facing direction, share it next time so I can make the directional advice more precise.")

              issue_tags = ", ".join(sorted(dict.fromkeys(detected_tags)))
              audit_scope = ", ".join(sorted(dict.fromkeys(scopes)))
              extra_metadata = {
                  "space_type": space_type,
                  "goal_detected": goal,
                  "facing_direction": direction,
                  "move_in_period": period,
                  "issue_tags": issue_tags,
                  "audit_scope": audit_scope,
                  "move_in_year": move_in_year_clean,
              }
              fact_lines = [
                  f"Audit scope: {audit_scope or 'general'}",
                  f"Space type: {space_type}",
                  f"Priority goal: {goal}",
                  f"Facing direction: {direction or 'unknown'}",
                  f"Move-in year: {move_in_year_clean or 'unknown'}",
                  f"Move-in period: {period_labels.get(period, period)}",
                  f"Detected issue tags: {issue_tags or 'none explicit'}",
                  f"Space description: {description_clean}",
              ]

              ready = result(
                  "ready",
                  "The fengshui request is ready for a grounded space audit.",
                  findings,
                  follow_up_questions,
                  recommendations,
                  [],
                  "medium" if detected_tags or direction or move_in_year_clean else "low",
                  "space-audit",
                  extra_metadata=extra_metadata,
              )
              return {
                  **ready,
                  "space_description_clean": description_clean,
                  "facing_direction_normalized": direction,
                  "priority_goal_normalized": goal_clean,
                  "move_in_year_normalized": move_in_year_clean,
                  "space_type": space_type,
                  "goal_detected": goal,
                  "move_in_period": period,
                  "issue_tags": issue_tags,
                  "audit_scope": audit_scope,
                  "fact_brief": "\n".join(f"- {line}" for line in fact_lines),
              }
        code_language: python3
        desc: Validate the space question, normalize direction and timing clues, and extract practical fengshui audit signals.
        outputs:
          status:
            children: null
            type: string
          skill:
            children: null
            type: string
          summary:
            children: null
