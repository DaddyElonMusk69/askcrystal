    - data:
        code: |
          def main(prepare_status: str, prepare_summary: str = "", prepare_findings: list = None, prepare_follow_up_questions: list = None, prepare_recommendations: list = None, prepare_safety_note: str = "", prepare_metadata: dict = None, fact_brief: str = "") -> dict:
              metadata = dict(prepare_metadata or {})
              status = prepare_status if prepare_status in {"ok", "needs_input"} else "ok"
              metadata.setdefault("confidence", "medium" if status == "ok" else "low")
              metadata.setdefault("missing_inputs", [])
              if fact_brief:
                  metadata["fact_brief"] = fact_brief
              return {
                  "status": status,
                  "skill": "fengshui_space_audit",
                  "summary": str(prepare_summary or "The fengshui audit signals are ready for interpretation."),
                  "findings": prepare_findings or [],
                  "follow_up_questions": prepare_follow_up_questions or [],
                  "recommendations": prepare_recommendations or [],
                  "safety_note": str(prepare_safety_note or "For environmental reflection only, not a substitute for structural, safety, or professional building advice."),
                  "metadata": metadata,
              }
        code_language: python3
