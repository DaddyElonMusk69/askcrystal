    - data:
        code: |
          def main(birth_date: str = "", name: str = "", analysis_focus: str = "") -> dict:
              import re
              from datetime import date, datetime

              zodiac_order = [
                  "Monkey", "Rooster", "Dog", "Pig", "Rat", "Ox",
                  "Tiger", "Rabbit", "Dragon", "Snake", "Horse", "Goat",
              ]
              zodiac_icons = {
                  "Rat": "🐀", "Ox": "🐂", "Tiger": "🐅", "Rabbit": "🐇",
                  "Dragon": "🐉", "Snake": "🐍", "Horse": "🐎", "Goat": "🐐",
                  "Monkey": "🐒", "Rooster": "🐓", "Dog": "🐕", "Pig": "🐖",
              }
              season_tones = {
                  1: "winter-introspection",
                  2: "winter-introspection",
                  3: "spring-emergence",
                  4: "spring-emergence",
                  5: "spring-emergence",
                  6: "summer-expression",
                  7: "summer-expression",
                  8: "summer-expression",
                  9: "autumn-discernment",
                  10: "autumn-discernment",
                  11: "autumn-discernment",
                  12: "winter-introspection",
              }
              life_path_themes = {
                  1: "initiating, self-propelled, and growth-oriented",
                  2: "sensitive, relational, and rhythm-aware",
                  3: "expressive, imaginative, and socially catalytic",
                  4: "steady, structured, and reliability-seeking",
                  5: "adaptive, freedom-seeking, and change-responsive",
                  6: "protective, responsible, and harmony-building",
                  7: "reflective, analytical, and depth-seeking",
                  8: "strategic, ambitious, and resource-aware",
                  9: "compassionate, integrative, and meaning-driven",
                  11: "intuitive, heightened, and inspiration-sensitive",
                  22: "visionary, systems-building, and long-range",
                  33: "nurturing, service-oriented, and emotionally magnetic",
              }
              birthday_themes = {
                  1: "You often move best when you can choose a direction and start cleanly.",
                  2: "Your daily energy tends to sharpen through cooperation, pacing, and emotional clarity.",
                  3: "Your natural spark rises when expression and experimentation are allowed.",
                  4: "You tend to feel stronger when routine, order, and repeatable structure are present.",
                  5: "Your day-to-day pattern tends to need movement, novelty, and flexible breathing room.",
                  6: "You often function best when responsibility and care feel meaningful rather than forced.",
                  7: "Your daily rhythm usually improves when you can think deeply and reduce noise.",
                  8: "You often find traction through goals, standards, and visible progress.",
                  9: "Your daily pattern often leans toward reflection, closure, and perspective-taking.",
                  11: "Your day pattern can feel unusually intuitive, so environment and overstimulation matter a lot.",
                  22: "You may do best when a big vision is translated into practical steps.",
                  33: "Your daily rhythm often strengthens when care, beauty, and emotional steadiness are aligned.",
              }
              personal_year_themes = {
                  1: "This is a reset-and-begin cycle that favors intentional starts.",
                  2: "This is a patience-and-partnership cycle that rewards emotional timing.",
                  3: "This is an expression-and-visibility cycle that favors connection and creativity.",
                  4: "This is a foundation-building cycle that favors discipline and consolidation.",
                  5: "This is a change cycle that asks for flexibility without chaos.",
                  6: "This is a responsibility-and-relationship cycle that favors repair and care.",
                  7: "This is a reflective cycle that favors depth, simplification, and inner recalibration.",
                  8: "This is an execution cycle that favors ambition, boundaries, and resource management.",
                  9: "This is a completion cycle that favors release, synthesis, and emotional honesty.",
                  11: "This cycle can feel electrically intuitive, so grounding matters as much as inspiration.",
                  22: "This cycle favors building something durable from a larger vision.",
                  33: "This cycle leans toward service, healing tone, and heart-led leadership.",
              }
              focus_keywords = {
                  "career": ["career", "work", "business", "money", "财", "事业", "工作"],
                  "relationships": ["love", "relationship", "dating", "marriage", "感情", "关系", "婚姻"],
                  "confidence": ["confidence", "self-worth", "self esteem", "自信", "底气"],
                  "reset": ["reset", "reinvent", "new phase", "重启", "转变", "新阶段"],
                  "emotional-pattern": ["emotion", "emotional", "trigger", "healing", "情绪", "疗愈", "触发"],
              }

              def clean(value: str) -> str:
                  return re.sub(r"\s+", " ", str(value or "")).strip()

              def reduce_number(value: int, preserve_master: bool = True) -> int:
                  current = abs(int(value))
                  while current > 9 and (not preserve_master or current not in {11, 22, 33}):
                      current = sum(int(ch) for ch in str(current))
                  return current

              def parse_birth_date(text: str):
                  normalized = clean(text)
                  if not normalized:
                      return None, ""

                  direct_formats = ["%Y-%m-%d", "%Y/%m/%d", "%Y.%m.%d", "%Y%m%d"]
                  for fmt in direct_formats:
                      try:
                          parsed = datetime.strptime(normalized, fmt).date()
                          return parsed, parsed.isoformat()
                      except ValueError:
                          pass

                  match = re.search(r"(\d{4})\D+(\d{1,2})\D+(\d{1,2})", normalized)
                  if match:
                      year, month, day = map(int, match.groups())
                      try:
                          parsed = date(year, month, day)
                          return parsed, parsed.isoformat()
                      except ValueError:
                          return None, ""

                  return None, ""

              def detect_focus(text: str) -> str:
                  lowered = clean(text).lower()
                  for focus, keywords in focus_keywords.items():
                      if any(keyword.lower() in lowered for keyword in keywords):
                          return focus
                  return "general"

              def result(status, summary, findings, follow_up_questions, recommendations, missing_inputs, confidence, mode, extra_metadata=None):
                  metadata = {
                      "confidence": confidence,
                      "missing_inputs": missing_inputs,
                      "source_family": "Numerologist_skills",
                      "mode": mode,
                      "intent_type": "reading",
                      "primary_method": "numerology",
                  }
                  if extra_metadata:
                      metadata.update(extra_metadata)
                  return {
                      "status": status,
                      "skill": "shushu_numerology_profile",
                      "summary": summary,
                      "findings": findings,
                      "follow_up_questions": follow_up_questions,
                      "recommendations": recommendations,
                      "safety_note": "For self-reflection and wellness support only, not deterministic fate analysis.",
                      "metadata": metadata,
                  }

              birth_date_clean = clean(birth_date)
              name_clean = clean(name)
              focus_clean = clean(analysis_focus)
              focus_detected = detect_focus(focus_clean)

              if not birth_date_clean:
                  intake = result(
                      "needs_input",
                      "A numerology-style profile needs a birth date before it can say anything reliable.",
                      ["This workflow is intentionally birth-date based, so it cannot generate a profile without that anchor."],
                      ["What birth date should I use for the profile? A simple YYYY-MM-DD format is perfect."],
                      ["If you want the profile shaped around a theme, you can also add a focus such as career, love, or confidence."],
                      ["birth_date"],
                      "low",
                      "intake",
                  )
                  return {
                      **intake,
                      "birth_date_normalized": "",
                      "name_clean": name_clean,
                      "focus_clean": focus_clean,
                      "focus_detected": focus_detected,
                      "life_path_number": "",
                      "birthday_number": "",
                      "attitude_number": "",
                      "personal_year_number": "",
                      "zodiac_sign": "",
                      "season_tone": "",
                      "fact_brief": "",
                  }

              parsed_date, birth_date_normalized = parse_birth_date(birth_date_clean)
              if parsed_date is None:
                  intake = result(
                      "needs_input",
                      "The birth date format is unclear, so the profile should pause until the date is confirmed.",
                      ["The workflow could not confidently parse the provided birth date."],
                      ["Could you send the birth date again in YYYY-MM-DD format?"],
                      ["If the date came from memory and the exact day is uncertain, mention that so the profile can stay cautious."],
                      ["birth_date"],
                      "low",
                      "intake",
                  )
                  return {
                      **intake,
                      "birth_date_normalized": "",
                      "name_clean": name_clean,
                      "focus_clean": focus_clean,
                      "focus_detected": focus_detected,
                      "life_path_number": "",
                      "birthday_number": "",
                      "attitude_number": "",
                      "personal_year_number": "",
                      "zodiac_sign": "",
                      "season_tone": "",
                      "fact_brief": "",
                  }

              digits = [int(ch) for ch in birth_date_normalized if ch.isdigit()]
              year = parsed_date.year
              month = parsed_date.month
              day = parsed_date.day
              current_year = date.today().year
              current_year_digits = [int(ch) for ch in str(current_year)]
              life_path_number = reduce_number(sum(digits))
              birthday_number = reduce_number(day)
              attitude_number = reduce_number(month + day)
              personal_year_number = reduce_number(month + day + sum(current_year_digits))
              zodiac_sign = zodiac_order[year % 12]
              season_tone = season_tones[month]

              findings = [
                  f"Life-path pattern {life_path_number} points to a temperament that often feels {life_path_themes.get(life_path_number, 'pattern-sensitive and reflective')}",
                  birthday_themes.get(birthday_number, "Your day-of-month pattern adds a distinctive personal rhythm to how you move through change."),
                  personal_year_themes.get(personal_year_number, "The current cycle is better treated as reflective context than hard prediction."),
              ]
              recommendations = [
                  "Choose one habit or relationship pattern to observe for the next 7 days instead of trying to reinvent everything at once.",
                  "Use the profile as a mirror for pacing and self-awareness, not as a rigid script you have to obey.",
              ]
              if focus_detected != "general":
                  recommendations.append(f"Let the next step focus on {focus_detected.replace('-', ' ')} so the profile turns into something practical.")
              if name_clean:
                  findings.append("A name was provided as context, so the profile can be phrased more personally, but the deterministic pattern still comes from the birth date.")

              extra_metadata = {
                  "birth_date": birth_date_normalized,
                  "life_path_number": str(life_path_number),
                  "birthday_number": str(birthday_number),
                  "attitude_number": str(attitude_number),
                  "personal_year_number": str(personal_year_number),
                  "zodiac_sign": zodiac_sign,
                  "season_tone": season_tone,
                  "focus_detected": focus_detected,
                  "current_year": str(current_year),
              }
              fact_lines = [
                  f"Birth date: {birth_date_normalized}",
                  f"Life-path number: {life_path_number}",
                  f"Birthday number: {birthday_number}",
                  f"Attitude number: {attitude_number}",
                  f"Personal year number ({current_year}): {personal_year_number}",
                  f"Chinese zodiac: {zodiac_icons.get(zodiac_sign, '')} {zodiac_sign}",
                  f"Seasonal tone: {season_tone}",
                  f"Analysis focus: {focus_detected}",
                  f"Name context: {name_clean or 'not provided'}",
              ]

              ready = result(
                  "ready",
                  "The numerology-style birthday profile is ready for interpretation.",
                  findings,
                  [],
                  recommendations,
                  [],
                  "medium",
                  "profile",
                  extra_metadata=extra_metadata,
              )
              return {
                  **ready,
                  "birth_date_normalized": birth_date_normalized,
                  "name_clean": name_clean,
                  "focus_clean": focus_clean,
                  "focus_detected": focus_detected,
                  "life_path_number": str(life_path_number),
                  "birthday_number": str(birthday_number),
                  "attitude_number": str(attitude_number),
                  "personal_year_number": str(personal_year_number),
                  "zodiac_sign": zodiac_sign,
                  "season_tone": season_tone,
                  "fact_brief": "\n".join(f"- {line}" for line in fact_lines),
              }
        code_language: python3
