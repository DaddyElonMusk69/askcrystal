                      "range": "6/21-7/22",
                      "element": "Water",
                      "modality": "Cardinal",
                      "ruler": "Moon",
                      "traits": "intuitive, protective, emotionally perceptive, nurturing",
                      "love": "needs emotional safety, care, and steady reassurance",
                      "career": "thrives when work has purpose and trusted relationships",
                      "finance": "benefits from protective planning and home-centered priorities",
                      "health": "does best with rest, nourishment, and emotional decompression",
                      "lucky_color": "silver",
                      "lucky_numbers": "2, 7",
