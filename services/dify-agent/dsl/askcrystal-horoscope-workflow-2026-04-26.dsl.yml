          variable: focus_area
      height: 232
      id: horoscope_start
      position:
        x: 40
        y: 260
      positionAbsolute:
        x: 40
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          def main(
              question: str = "",
              zodiac_sign: str = "",
              birth_date: str = "",
              target_date: str = "",
              period: str = "",
              focus_area: str = "",
          ) -> dict:
              import hashlib
              import re
              from datetime import date, datetime, timedelta

              sign_profiles = {
                  "Aries": {
