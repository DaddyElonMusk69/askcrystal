                      "ruler": "Sun",
                      "traits": "radiant, loyal, expressive, creative",
                      "love": "needs warmth, admiration, play, and sincere devotion",
                      "career": "thrives through visibility, leadership, and creative ownership",
                      "finance": "benefits from balancing generosity with clear limits",
                      "health": "does best with sunlight, movement, and joyful expression",
                      "lucky_color": "gold",
                      "lucky_numbers": "1, 10",
                      "best_match": "Aries",
                  },
                  "Virgo": {
                      "range": "8/23-9/22",
                      "element": "Earth",
                      "modality": "Mutable",
                      "ruler": "Mercury",
                      "traits": "discerning, practical, service-oriented, precise",
                      "love": "needs reliability, thoughtful details, and useful care",
                      "career": "thrives through refinement, systems, and problem-solving",
                      "finance": "benefits from clean budgets and reducing perfectionist delay",
                      "health": "does best with digestion-friendly routine and mental uncluttering",
                      "lucky_color": "sage green",
                      "lucky_numbers": "5, 14",
                      "best_match": "Taurus",
                  },
                  "Libra": {
                      "range": "9/23-10/22",
                      "element": "Air",
                      "modality": "Cardinal",
                      "ruler": "Venus",
                      "traits": "harmonizing, diplomatic, aesthetic, relational",
                      "love": "needs reciprocity, beauty, fairness, and open dialogue",
                      "career": "thrives in partnership, mediation, design, and social strategy",
                      "finance": "benefits from aligning pleasure spending with real priorities",
                      "health": "does best with balance, breath, and peaceful surroundings",
                      "lucky_color": "rose",
                      "lucky_numbers": "6, 15",
                      "best_match": "Gemini",
                  },
                  "Scorpio": {
                      "range": "10/23-11/21",
                      "element": "Water",
                      "modality": "Fixed",
                      "ruler": "Pluto",
                      "traits": "perceptive, intense, loyal, transformational",
                      "love": "needs depth, truth, trust, and emotional courage",
                      "career": "thrives through research, focus, and uncovering what is hidden",
                      "finance": "benefits from strategic control without gripping too tightly",
                      "health": "does best with emotional release and deep rest",
                      "lucky_color": "deep red",
                      "lucky_numbers": "8, 11",
                      "best_match": "Cancer",
                  },
                  "Sagittarius": {
                      "range": "11/22-12/21",
                      "element": "Fire",
                      "modality": "Mutable",
                      "ruler": "Jupiter",
                      "traits": "expansive, honest, adventurous, meaning-seeking",
                      "love": "needs freedom, shared growth, and a sense of adventure",
                      "career": "thrives through teaching, travel, publishing, and big-picture work",
                      "finance": "benefits from optimism paired with grounded planning",
                      "health": "does best with outdoor movement and spacious routines",
                      "lucky_color": "royal blue",
                      "lucky_numbers": "3, 12",
                      "best_match": "Aries",
                  },
                  "Capricorn": {
                      "range": "12/22-1/19",
                      "element": "Earth",
                      "modality": "Cardinal",
                      "ruler": "Saturn",
                      "traits": "disciplined, strategic, patient, achievement-oriented",
                      "love": "needs loyalty, maturity, and actions that match words",
                      "career": "thrives through structure, responsibility, and long-range goals",
                      "finance": "benefits from steady accumulation and clear commitments",
                      "health": "does best with recovery time and less pressure on the body",
                      "lucky_color": "charcoal",
                      "lucky_numbers": "8, 10",
                      "best_match": "Taurus",
                  },
                  "Aquarius": {
                      "range": "1/20-2/18",
                      "element": "Air",
                      "modality": "Fixed",
                      "ruler": "Uranus",
                      "traits": "innovative, independent, principled, future-facing",
                      "love": "needs friendship, freedom, and intellectual honesty",
                      "career": "thrives through systems thinking, community, and unusual ideas",
                      "finance": "benefits from balancing experimentation with reserves",
                      "health": "does best with circulation, movement, and mental spaciousness",
                      "lucky_color": "electric blue",
                      "lucky_numbers": "4, 11",
                      "best_match": "Libra",
                  },
                  "Pisces": {
                      "range": "2/19-3/20",
                      "element": "Water",
                      "modality": "Mutable",
                      "ruler": "Neptune",
                      "traits": "imaginative, compassionate, intuitive, porous",
                      "love": "needs tenderness, imagination, and clear emotional boundaries",
                      "career": "thrives through creativity, healing arts, and compassionate service",
                      "finance": "benefits from practical anchors around generous impulses",
                      "health": "does best with sleep care, water rituals, and boundary repair",
                      "lucky_color": "sea green",
                      "lucky_numbers": "7, 12",
                      "best_match": "Cancer",
                  },
              }
              aliases = {
                  sign.lower(): sign for sign in sign_profiles
              }
              aliases.update({
                  "ram": "Aries",
                  "bull": "Taurus",
                  "twins": "Gemini",
                  "crab": "Cancer",
                  "lion": "Leo",
                  "maiden": "Virgo",
                  "scales": "Libra",
                  "scorpion": "Scorpio",
                  "archer": "Sagittarius",
                  "goat": "Capricorn",
                  "water bearer": "Aquarius",
                  "fish": "Pisces",
              })
              date_ranges = [
                  ("Capricorn", (1, 1), (1, 19)),
                  ("Aquarius", (1, 20), (2, 18)),
                  ("Pisces", (2, 19), (3, 20)),
                  ("Aries", (3, 21), (4, 19)),
                  ("Taurus", (4, 20), (5, 20)),
                  ("Gemini", (5, 21), (6, 20)),
                  ("Cancer", (6, 21), (7, 22)),
                  ("Leo", (7, 23), (8, 22)),
                  ("Virgo", (8, 23), (9, 22)),
                  ("Libra", (9, 23), (10, 22)),
                  ("Scorpio", (10, 23), (11, 21)),
                  ("Sagittarius", (11, 22), (12, 21)),
                  ("Capricorn", (12, 22), (12, 31)),
              ]
              month_names = {
                  "jan": 1, "january": 1, "feb": 2, "february": 2, "mar": 3, "march": 3,
                  "apr": 4, "april": 4, "may": 5, "jun": 6, "june": 6, "jul": 7, "july": 7,
                  "aug": 8, "august": 8, "sep": 9, "sept": 9, "september": 9,
                  "oct": 10, "october": 10, "nov": 11, "november": 11, "dec": 12, "december": 12,
              }

              def clean(value: str) -> str:
                  return re.sub(r"\s+", " ", str(value or "")).strip()

              def detect_language(text: str) -> str:
                  return "zh" if re.search(r"[\u4e00-\u9fff]", text or "") else "en"

              def parse_calendar_date(text: str, allow_missing_year: bool = True):
                  normalized = clean(text)
                  if not normalized:
                      return None, ""
                  lowered = normalized.lower()
                  today = date.today()
                  if lowered in {"today", "now"}:
                      return today, today.isoformat()
                  if lowered == "tomorrow":
                      parsed = today + timedelta(days=1)
                      return parsed, parsed.isoformat()
                  if lowered in {"yesterday"}:
                      parsed = today - timedelta(days=1)
                      return parsed, parsed.isoformat()

                  for fmt in ["%Y-%m-%d", "%Y/%m/%d", "%Y.%m.%d", "%Y%m%d"]:
                      try:
                          parsed = datetime.strptime(normalized, fmt).date()
                          return parsed, parsed.isoformat()
                      except ValueError:
                          pass

                  match = re.search(r"(\d{4})\D+(\d{1,2})\D+(\d{1,2})", normalized)
                  if match:
                      year, month, day = map(int, match.groups())
                      try:
                          parsed = date(year, month, day)
                          return parsed, parsed.isoformat()
                      except ValueError:
                          return None, ""

                  match = re.search(r"\b([a-zA-Z]+)\s+(\d{1,2})(?:st|nd|rd|th)?(?:,\s*(\d{4}))?", normalized)
                  if match:
                      month = month_names.get(match.group(1).lower())
                      day = int(match.group(2))
                      year = int(match.group(3)) if match.group(3) else today.year
                      if month and (allow_missing_year or match.group(3)):
                          try:
                              parsed = date(year, month, day)
                              return parsed, parsed.isoformat()
                          except ValueError:
                              return None, ""

                  match = re.search(r"\b(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b", normalized)
                  if match and allow_missing_year:
                      first, second = int(match.group(1)), int(match.group(2))
                      year = int(match.group(3)) if match.group(3) else today.year
                      if year < 100:
                          year += 2000
                      try:
                          parsed = date(year, first, second)
                          return parsed, parsed.isoformat()
                      except ValueError:
                          try:
                              parsed = date(year, second, first)
                              return parsed, parsed.isoformat()
                          except ValueError:
                              return None, ""

                  return None, ""

              def sign_from_month_day(month: int, day: int) -> str:
                  for sign, start, end in date_ranges:
                      if (month, day) >= start and (month, day) <= end:
                          return sign
                  return ""

              def detect_sign(explicit: str, text: str, birthday_text: str):
                  explicit_clean = clean(explicit).lower()
                  if explicit_clean:
                      for alias, sign in aliases.items():
                          if explicit_clean == alias or alias in explicit_clean:
                              return sign, "explicit"

                  lowered = clean(text).lower()
                  if re.search(r"\ball\s*(12|twelve)?\s*(signs|zodiac)", lowered):
                      return "All Signs", "all_signs"
                  for alias, sign in sorted(aliases.items(), key=lambda item: len(item[0]), reverse=True):
                      if re.search(rf"\b{re.escape(alias)}\b", lowered):
                          return sign, "question"

                  birthday, _ = parse_calendar_date(birthday_text, allow_missing_year=True)
                  if birthday:
                      inferred = sign_from_month_day(birthday.month, birthday.day)
                      if inferred:
                          return inferred, "birth_date"
                  return "", ""

              def detect_period(value: str, text: str) -> str:
                  combined = f"{value} {text}".lower()
                  if "month" in combined or "monthly" in combined:
                      return "monthly"
                  if "week" in combined or "weekly" in combined:
                      return "weekly"
                  return "daily"

              def detect_focus(value: str, text: str) -> str:
                  combined = f"{value} {text}".lower()
                  focus_terms = {
                      "love": ["love", "relationship", "dating", "partner", "romance", "感情", "恋爱"],
                      "career": ["career", "work", "job", "business", "study", "事业", "工作"],
                      "finance": ["finance", "money", "wealth", "income", "spending", "财", "钱"],
                      "health": ["health", "energy", "sleep", "body", "wellness", "健康", "能量", "睡眠"],
                  }
                  for focus, terms in focus_terms.items():
                      if any(term in combined for term in terms):
                          return focus
                  return "general"

              def build_scores(sign: str, reading_date: date, focus: str) -> dict:
                  seed = f"{sign}:{reading_date.isoformat()}:{focus}"
                  digest = hashlib.md5(seed.encode("utf-8")).hexdigest()
                  values = [3 + (int(digest[index], 16) % 3) for index in range(5)]
                  scores = {
                      "overall": values[0],
                      "love": values[1],
                      "career": values[2],
                      "finance": values[3],
                      "health": values[4],
                  }
                  weekday = reading_date.weekday()
                  if weekday == 0:
                      scores["career"] += 1
                  if weekday == 4:
                      scores["love"] += 1
                  if weekday == 5:
                      scores["health"] += 1
                  if weekday == 6:
                      scores["overall"] += 1
                  if focus in scores:
                      scores[focus] += 1
                  for key in scores:
                      scores[key] = max(2, min(5, scores[key]))
                  while sum(scores.values()) > 19:
                      key = max(scores, key=scores.get)
                      if scores[key] <= 3:
                          break
                      scores[key] -= 1
                  while sum(scores.values()) < 14:
                      key = min(scores, key=scores.get)
                      if scores[key] >= 5:
                          break
                      scores[key] += 1
                  return scores

              def star_text(score: int) -> str:
                  return f"{score}/5"

              def result(status, summary, findings, follow_up_questions, recommendations, missing_inputs, confidence, mode, extra_metadata=None):
                  metadata = {
                      "confidence": confidence,
                      "missing_inputs": missing_inputs,
                      "source_family": "horoscope-daily-2.3.0",
                      "mode": mode,
                      "intent_type": "reading",
                      "primary_method": "horoscope",
                  }
                  if extra_metadata:
                      metadata.update(extra_metadata)
                  return {
                      "status": status,
                      "skill": "horoscope_daily_guidance",
                      "summary": summary,
                      "findings": findings,
                      "follow_up_questions": follow_up_questions,
                      "recommendations": recommendations,
                      "safety_note": "For wellness and self-reflection purposes only; not medical, legal, or financial advice.",
                      "metadata": metadata,
                  }

              question_clean = clean(question)
              sign, sign_source = detect_sign(zodiac_sign, question_clean, birth_date)
              reading_date, target_date_normalized = parse_calendar_date(target_date or question_clean, allow_missing_year=True)
              if reading_date is None:
                  reading_date = date.today()
                  target_date_normalized = reading_date.isoformat()
              period_detected = detect_period(period, question_clean)
              focus_detected = detect_focus(focus_area, question_clean)
              language = detect_language(question_clean)

              if not sign:
                  intake = result(
                      "needs_input",
                      "A horoscope reading needs a Western zodiac sign or a birth date before it can be grounded.",
                      ["No clear sun sign was provided or inferred from the request."],
                      ["What is your zodiac sign, or what is your birth date?"],
                      ["Once the sign is known, the reading can be shaped around love, career, energy, or general guidance."],
                      ["zodiac_sign"],
                      "low",
                      "intake",
                      extra_metadata={
                          "period": period_detected,
                          "focus_area": focus_detected,
                          "target_date": target_date_normalized,
                          "language": language,
                      },
                  )
                  return {
                      **intake,
                      "question_clean": question_clean,
                      "zodiac_sign": "",
                      "sign_profile": "",
                      "period": period_detected,
                      "focus_area": focus_detected,
                      "target_date_normalized": target_date_normalized,
                      "fact_brief": "",
                  }

              if sign == "All Signs":
                  extra_metadata = {
                      "zodiac_sign": "All Signs",
                      "sign_source": sign_source,
                      "period": period_detected,
                      "focus_area": focus_detected,
                      "target_date": target_date_normalized,
                      "language": language,
                  }
                  ready = result(
                      "ok",
                      "The request asks for a broad horoscope sweep across all twelve signs.",
                      [
                          "Keep each sign concise so the answer stays usable in chat.",
                          "Use the same reflective, non-fatalistic tone as single-sign horoscope guidance.",
                      ],
                      [],
                      [
                          "Return a compact all-signs overview rather than a long publication-style forecast.",
                          "If the user wants depth, invite them to choose one sign afterward.",
                      ],
                      [],
                      "medium",
                      period_detected,
                      extra_metadata=extra_metadata,
                  )
                  return {
                      **ready,
                      "question_clean": question_clean,
                      "zodiac_sign": "All Signs",
                      "sign_profile": "All twelve Western zodiac signs, ordered Aries through Pisces.",
                      "period": period_detected,
                      "focus_area": focus_detected,
                      "target_date_normalized": target_date_normalized,
                      "fact_brief": f"- Mode: all signs\n- Period: {period_detected}\n- Focus: {focus_detected}\n- Target date: {target_date_normalized}",
                  }

              profile = sign_profiles[sign]
              scores = build_scores(sign, reading_date, focus_detected)
              birthday_parsed, birthday_normalized = parse_calendar_date(birth_date, allow_missing_year=True)
              birthday_note = ""
              if birthday_parsed:
                  birthday_this_year = date(reading_date.year, birthday_parsed.month, birthday_parsed.day)
                  if abs((birthday_this_year - reading_date).days) <= 3:
                      birthday_note = "The target date is close to the user's birthday, so mention a gentle birthday-energy lift."

              score_brief = ", ".join(f"{key}: {star_text(value)}" for key, value in scores.items())
              sign_profile = (
                  f"{sign} ({profile['range']}), {profile['element']} {profile['modality']}, ruled by {profile['ruler']}. "
                  f"Core traits: {profile['traits']}."
              )
              findings = [
                  f"{sign} is a {profile['element']} sign with a {profile['modality'].lower()} rhythm, so the reading should connect symbolic energy to practical pacing.",
                  f"Focus area: {focus_detected}. Period: {period_detected}. Target date: {target_date_normalized}.",
                  f"Balanced rating seed: {score_brief}.",
              ]
              if birthday_note:
                  findings.append(birthday_note)
              recommendations = [
                  f"Anchor the reading in {profile['ruler']} symbolism without claiming precise astronomical calculation.",
                  "Give one concrete action the user can try within the reading period.",
                  "Keep the language warm, modern, and non-deterministic.",
              ]
              extra_metadata = {
                  "zodiac_sign": sign,
                  "sign_source": sign_source,
                  "period": period_detected,
                  "focus_area": focus_detected,
                  "target_date": target_date_normalized,
                  "birth_date": birthday_normalized,
                  "language": language,
                  "element": profile["element"],
                  "modality": profile["modality"],
                  "ruling_planet": profile["ruler"],
                  "scores": scores,
                  "lucky_color": profile["lucky_color"],
                  "lucky_numbers": profile["lucky_numbers"],
                  "best_match": profile["best_match"],
              }
              fact_lines = [
                  f"Question: {question_clean}",
                  f"Sign: {sign}",
                  f"Sign source: {sign_source}",
                  f"Period: {period_detected}",
                  f"Focus area: {focus_detected}",
                  f"Target date: {target_date_normalized} ({reading_date.strftime('%A')})",
                  f"Profile: {sign_profile}",
                  f"Love tendency: {profile['love']}",
                  f"Career tendency: {profile['career']}",
                  f"Finance tendency: {profile['finance']}",
                  f"Health tendency: {profile['health']}",
                  f"Ratings: {score_brief}",
                  f"Lucky color: {profile['lucky_color']}",
                  f"Lucky numbers: {profile['lucky_numbers']}",
                  f"Best match today: {profile['best_match']}",
              ]
              if birthday_note:
                  fact_lines.append(birthday_note)

              ready = result(
                  "ok",
                  f"The {period_detected} horoscope context for {sign} is ready.",
                  findings,
                  [],
                  recommendations,
                  [],
                  "medium",
                  period_detected,
                  extra_metadata=extra_metadata,
              )
              return {
