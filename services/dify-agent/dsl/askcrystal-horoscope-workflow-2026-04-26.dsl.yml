    - data:
        code: |
          def main(text: str, prepare_status: str, prepare_summary: str = "", prepare_findings: list = None, prepare_recommendations: list = None, prepare_metadata: dict = None) -> dict:
              import json
              import re

              def fallback_payload(raw_text: str) -> dict:
                  summary = (prepare_summary or "").strip() or "The horoscope workflow completed, but the structured format needs a retry."
                  findings = prepare_findings or [summary]
                  return {
                      "status": prepare_status if prepare_status in {"ok", "needs_input"} else "ok",
                      "skill": "horoscope_daily_guidance",
                      "summary": summary,
                      "findings": findings,
                      "follow_up_questions": [],
                      "recommendations": prepare_recommendations or ["Retry the horoscope request if a cleaner structured result is needed."],
                      "safety_note": "For wellness and self-reflection purposes only; not medical, legal, or financial advice.",
                      "metadata": dict(prepare_metadata or {}),
                  }

              raw = (text or "").strip()
              parsed = None
              if raw:
                  candidates = [raw]
                  fenced = re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", raw, re.S)
                  candidates.extend(fenced)
                  brace_match = re.search(r"(\{.*\})", raw, re.S)
                  if brace_match:
                      candidates.append(brace_match.group(1))
                  for candidate in candidates:
                      try:
                          parsed = json.loads(candidate)
                          break
                      except Exception:
                          continue

              payload = parsed if isinstance(parsed, dict) else fallback_payload(raw)
              payload["status"] = payload.get("status") or (prepare_status if prepare_status in {"ok", "needs_input"} else "ok")
              if payload["status"] not in {"ok", "needs_input"}:
                  payload["status"] = prepare_status if prepare_status in {"ok", "needs_input"} else "ok"
              payload["skill"] = "horoscope_daily_guidance"
              payload["summary"] = str(payload.get("summary") or "")
              payload["findings"] = payload.get("findings") if isinstance(payload.get("findings"), list) else (prepare_findings or [])
              payload["follow_up_questions"] = payload.get("follow_up_questions") if isinstance(payload.get("follow_up_questions"), list) else []
              payload["recommendations"] = payload.get("recommendations") if isinstance(payload.get("recommendations"), list) else (prepare_recommendations or [])
              payload["safety_note"] = str(payload.get("safety_note") or "For wellness and self-reflection purposes only; not medical, legal, or financial advice.")

              metadata = dict(prepare_metadata or {})
              llm_metadata = payload.get("metadata") if isinstance(payload.get("metadata"), dict) else {}
              metadata.update(llm_metadata)
              metadata.setdefault("confidence", "medium" if payload["status"] == "ok" else "low")
              metadata.setdefault("missing_inputs", [])
              metadata.setdefault("source_family", "horoscope-daily-2.3.0")
              metadata.setdefault("primary_method", "horoscope")
              payload["metadata"] = metadata

              return payload
        code_language: python3
        desc: Parse the LLM response into the shared horoscope skill contract.
        outputs:
          status:
            children: null
            type: string
          skill:
            children: null
            type: string
          summary:
