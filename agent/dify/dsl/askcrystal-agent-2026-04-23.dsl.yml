  - Give me a mythology-themed reading for love and timing
  - Combine my zodiac sign with a crystal ritual plan
  suggested_questions_after_answer:
    enabled: true
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
