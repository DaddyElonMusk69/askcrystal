skills:
  - id: shushu_numerology_profile
    name: Shushu Numerology Profile
    description: Build a numerology-style profile from birth/date/name patterns using Chinese metaphysics framing.
    when_to_use: Use when users ask for 数字命理, 数字能量, life path number, or name/date energetic pattern reading.
    tags: [cn, shushu, numerology, profile]
    inputs:
      - name: birth_date
        description: Birth date in YYYY-MM-DD (or lunar date with explicit note).
        required: true
      - name: name
        description: Current name.
        required: false
        default: not provided
      - name: analysis_focus
        description: Focus such as personality, career, relationship, money.
        required: false
        default: personality and growth
    template: |
      You are executing a Chinese numerology-style profile reading.
      Return:
      1) core number pattern,
      2) personality signature,
      3) opportunity and risk tendencies,
      4) practical weekly actions,
      5) optional crystal support direction.

      Birth date: {birth_date}
      Name: {name}
      Focus: {analysis_focus}

  - id: bazi_chart_analysis
    name: Bazi Chart Analysis
    description: Structured four-pillars analysis with clear evidence and non-fatalistic guidance.
    when_to_use: Use when users ask for 八字, 四柱, 命盘, 大运, 流年, 喜用神, or destiny analysis via Bazi.
    tags: [cn, bazi, four-pillars, destiny]
    inputs:
      - name: birth_datetime
        description: Birth datetime (include timezone/city if known).
        required: true
      - name: gender
        description: Gender for dayun direction.
        required: true
      - name: calendar_note
        description: Solar/lunar and leap-month note.
        required: false
        default: solar calendar unless user says lunar
      - name: user_goal
        description: What the user wants to understand.
        required: false
        default: overall trend and current cycle
    template: |
      Produce a Bazi reading with a structured order:
      - assumptions and calendar/time caveats,
      - day master strength and pattern,
      - useful/unfavorable elements,
      - cycle (dayun/liunian) implications,
      - grounded actions for next 3 months.

      Birth datetime: {birth_datetime}
      Gender: {gender}
      Calendar note: {calendar_note}
      User goal: {user_goal}

  - id: yinyuan_matchmaking
    name: Yinyuan Matchmaking Read
    description: Relationship compatibility read using Chinese matchmaking lenses with supportive framing.
    when_to_use: Use when users ask about 合婚, 姻缘, 正缘, compatibility, timing to meet partner, or relationship trajectory.
    tags: [cn, marriage, compatibility, yinyuan]
    inputs:
      - name: person_a
        description: Person A profile (birth info or zodiac).
        required: true
      - name: person_b
        description: Person B profile (birth info or zodiac).
        required: false
        default: not provided
      - name: question
        description: Main relationship question.
        required: true
    template: |
      Give a relationship-focused divination summary using non-deterministic language.
      Include:
      - compatibility drivers,
      - friction patterns,
      - timing windows,
      - communication rituals,
      - crystal/intention support suggestions.

      Person A: {person_a}
      Person B: {person_b}
      Question: {question}

  - id: fengshui_space_audit
    name: Fengshui Space Audit
    description: Practical fengshui layout review for home/workspace with actionable corrections.
    when_to_use: Use when users ask for 风水, layout optimization, entrance/bed/desk placement, wealth or relationship corners.
    tags: [cn, fengshui, layout, space]
    inputs:
      - name: space_description
        description: Floor plan or textual layout (door, bedroom, kitchen, desk, windows).
        required: true
      - name: facing_direction
        description: Main facing direction if known.
        required: false
        default: unknown
      - name: priority_goal
        description: Goal such as wealth, focus, health, harmony.
        required: false
        default: balance and smooth daily flow
    template: |
      Produce a fengshui review with:
      - current pattern diagnosis,
      - top 3 low-cost fixes,
      - top 2 medium-impact adjustments,
      - what to avoid this month,
      - rationale in plain language.

      Space description: {space_description}
      Facing direction: {facing_direction}
      Priority goal: {priority_goal}

  - id: tarot_spread_interpretation_cn
    name: Tarot Spread Interpretation (CN)
    description: Tarot interpretation with a gentle Chinese-first narrative style and practical advice.
    when_to_use: Use when users ask for 塔罗, card reading, spread interpretation, emotional guidance, or decision clarity.
    tags: [cn, tarot, cards, guidance]
    inputs:
      - name: spread_type
        description: Spread type (single, three-card, celtic-cross, etc).
        required: true
      - name: cards_drawn
        description: Cards and orientations.
        required: true
      - name: question
        description: User's tarot question.
        required: true
    template: |
      Interpret this tarot spread as reflection guidance (not fixed fate).
      Output:
      - energy overview,
      - per-card role,
      - pattern between cards,
      - one action within 48h,
      - one reflection prompt.

      Spread type: {spread_type}
      Cards: {cards_drawn}
      Question: {question}

  - id: taibu_structured_divination_router
    name: Taibu Structured Divination Router
    description: Decide the right divination workflow and response contract for mixed user questions.
    when_to_use: Use when user asks cross-domain questions (Bazi + Tarot + yearly trend), or when method selection is unclear.
    tags: [cn, taibu, workflow, router]
    inputs:
      - name: user_query
        description: Raw user request.
        required: true
      - name: available_methods
        description: Methods currently available.
        required: false
        default: bazi, tarot, fengshui, compatibility, crystal
    template: |
      Route this user query to the best method and return a plan:
      1) chosen domain and why,
      2) minimum required inputs,
      3) response structure (结论/依据/建议),
      4) fallback if required data is missing,
      5) safety boundary notes.

      User query: {user_query}
      Available methods: {available_methods}

  - id: qimen_timing_direction_read
    name: Qimen Timing and Direction Read
    description: Give timing and directional guidance for a specific decision using qimen-style framing.
    when_to_use: Use when users ask best timing, action windows, direction choice, or go/no-go guidance for a specific event.
    tags: [cn, qimen, timing, decision]
    inputs:
      - name: decision_context
        description: What decision/event is being evaluated.
        required: true
      - name: target_time
        description: Candidate time or now.
        required: false
        default: now
      - name: location
        description: City/timezone.
        required: false
        default: Asia/Shanghai
    template: |
      Provide a qimen-style decision brief:
      - best action window,
      - avoid window,
      - favorable direction/positioning,
      - confidence level and missing inputs,
      - practical next step.

      Decision context: {decision_context}
      Target time: {target_time}
      Location: {location}

  - id: ziwei_palace_theme_read
    name: Ziwei Palace Theme Read
    description: Explain life themes through ziwei palace structure and current cycle.
    when_to_use: Use when users ask for 紫微斗数, 命宫, 夫妻宫, 官禄宫, 大限, 流年 interpretation.
    tags: [cn, ziwei, palace, cycle]
    inputs:
      - name: profile_input
        description: Birth details or existing ziwei chart summary.
        required: true
      - name: theme_focus
        description: Focus palace/theme.
        required: false
        default: career and relationship
    template: |
      Return a ziwei-themed reading with:
      - core palace themes,
      - strengths/challenges,
      - cycle-stage interpretation,
      - reality-based action suggestions,
      - gentle caution points.

      Profile input: {profile_input}
      Theme focus: {theme_focus}
