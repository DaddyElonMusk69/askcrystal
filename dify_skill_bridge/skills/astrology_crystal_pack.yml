skills:
  - id: western_natal_archetype_read
    name: Western Natal Archetype Read
    description: Translate natal placements into emotional/archetypal patterns with practical guidance.
    when_to_use: Use when users ask for natal chart reading, sun/moon/rising interpretation, or personality-energy blueprint.
    tags: [astrology, natal, archetype, west]
    inputs:
      - name: birth_datetime
        description: Birth datetime and timezone.
        required: true
      - name: birth_place
        description: Birth city/country.
        required: true
      - name: focus
        description: Focus theme.
        required: false
        default: identity and emotional pattern
    template: |
      Give a natal archetype reading with:
      - core triad (sun/moon/rising style summary),
      - dominant element/modalities,
      - repeating life pattern,
      - one growth practice for next 7 days,
      - crystal profile to support this pattern.

      Birth datetime: {birth_datetime}
      Birth place: {birth_place}
      Focus: {focus}

  - id: astrology_transit_checkin
    name: Astrology Transit Check-in
    description: Explain short-term emotional/decision pressure through transit framing.
    when_to_use: Use when users ask why a week feels intense, timing for decisions, or current astrological influence.
    tags: [astrology, transit, timing, forecast]
    inputs:
      - name: current_date
        description: Date for check-in.
        required: true
      - name: user_context
        description: Current life context and concerns.
        required: true
      - name: natal_hint
        description: Optional natal clues if full chart not available.
        required: false
        default: unknown
    template: |
      Provide a transit-style check-in:
      - current energetic theme,
      - what to lean into,
      - what to postpone,
      - communication/relationship caution,
      - crystal support for regulation.

      Current date: {current_date}
      User context: {user_context}
      Natal hint: {natal_hint}

  - id: synastry_relationship_map
    name: Synastry Relationship Map
    description: Relationship compatibility read using astrology dynamics and healthy communication framing.
    when_to_use: Use when users ask are we compatible, partner dynamics, conflict loops, or relationship timing.
    tags: [astrology, synastry, relationship]
    inputs:
      - name: person_a_profile
        description: Birth details or known big-three.
        required: true
      - name: person_b_profile
        description: Birth details or known big-three.
        required: true
      - name: relationship_question
        description: Main question.
        required: true
    template: |
      Create a synastry map with:
      - natural harmony zones,
      - friction triggers,
      - repair language for conflict,
      - realistic compatibility outlook,
      - crystal pairing for emotional balance.

      Person A: {person_a_profile}
      Person B: {person_b_profile}
      Question: {relationship_question}

  - id: crystal_intention_matcher
    name: Crystal Intention Matcher
    description: Match crystal recommendations to emotional intention and current state.
    when_to_use: Use when users ask what crystal should I use for anxiety, confidence, love, abundance, protection, focus, or healing support.
    tags: [crystal, intention, recommendation]
    inputs:
      - name: intention
        description: User intention.
        required: true
      - name: emotional_state
        description: Current emotional state.
        required: false
        default: not provided
      - name: constraints
        description: Budget/wearability/preferences.
        required: false
        default: beginner, daily wearable
    template: |
      Recommend 1-3 crystals by intention.
      For each crystal include:
      - why this match works,
      - chakra/element relation,
      - wear/use method,
      - expected emotional support pattern.

      Intention: {intention}
      Emotional state: {emotional_state}
      Constraints: {constraints}

  - id: crystal_chakra_balance_plan
    name: Crystal Chakra Balance Plan
    description: Build a simple chakra balancing plan using crystal pairings.
    when_to_use: Use when users ask for chakra balancing, blocked energy clearing, emotional reset, or meditation support.
    tags: [crystal, chakra, healing]
    inputs:
      - name: chakra_focus
        description: Target chakra(s).
        required: true
      - name: symptoms
        description: Emotional/body symptoms user reports.
        required: false
        default: general imbalance
      - name: routine_time
        description: Available daily ritual time.
        required: false
        default: 10 minutes
    template: |
      Create a chakra balancing plan with:
      - selected crystal set,
      - breathing/placement routine,
      - 7-day progression,
      - check-in signals to track.

      Chakra focus: {chakra_focus}
      Symptoms: {symptoms}
      Routine time: {routine_time}

  - id: crystal_cleansing_and_charging
    name: Crystal Cleansing and Charging
    description: Safe care protocol for cleansing, charging, and storing crystals.
    when_to_use: Use when users ask how to cleanse, charge, activate, or maintain crystals.
    tags: [crystal, care, cleansing]
    inputs:
      - name: crystal_list
        description: Crystal names user owns.
        required: true
      - name: method_preference
        description: Preferred methods (moonlight, sound, smoke, etc).
        required: false
        default: moonlight and sound
    template: |
      Give a crystal care protocol:
      - methods safe for each crystal,
      - methods to avoid,
      - charging cadence,
      - storage and handling tips,
      - beginner mistakes to avoid.

      Crystal list: {crystal_list}
      Method preference: {method_preference}

  - id: crystal_grid_manifestation_design
    name: Crystal Grid Manifestation Design
    description: Design a simple crystal grid for a specific intention with clear setup steps.
    when_to_use: Use when users ask to create a manifestation grid for love, money, confidence, healing, or protection.
    tags: [crystal, grid, manifestation]
    inputs:
      - name: intention
        description: Grid intention.
        required: true
      - name: available_crystals
        description: Crystals user already has.
        required: false
        default: beginner set
      - name: ritual_style
        description: User preferred ritual style.
        required: false
        default: minimal and practical
    template: |
      Build a crystal grid recipe:
      - center stone and supporting stones,
      - placement pattern,
      - activation phrase,
      - 7-day upkeep routine,
      - signs to evaluate progress.

      Intention: {intention}
      Available crystals: {available_crystals}
      Ritual style: {ritual_style}

  - id: astro_crystal_synthesis
    name: Astrology + Crystal Synthesis
    description: Blend astrology pattern and crystal recommendation into one coherent plan.
    when_to_use: Use when users want both astrology guidance and crystal prescriptions in one response.
    tags: [astrology, crystal, synthesis]
    inputs:
      - name: user_context
        description: User situation and emotional challenge.
        required: true
      - name: astro_signal
        description: Natal/transit summary if available.
        required: false
        default: unknown
    template: |
      Create an integrated astrology-crystal support plan:
      - core pattern from astrology signal,
      - crystal trio and role split,
      - daily and weekly ritual,
      - what improvement markers to watch,
      - realistic expectation and boundaries.

      User context: {user_context}
      Astrology signal: {astro_signal}
